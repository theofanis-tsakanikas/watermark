# Start the expensive things, drive the scenario, stop them again.
#
# **Never run, and it is the file most likely to be misread**, so: the three things this starts
# — the Managed Flink application, the Feature Store online store and the inference endpoint —
# are the three `CLAUDE.md` names as the expensive ones. They bill continuously from the moment
# they run, whether or not anything reads them, which is why `deploy.yml` creates the first one
# stopped and leaves the other two behind flags. Nothing but this workflow turns them on.
#
# It is one job with a `stop` step that runs `if: always()`. A capture that fails halfway and
# leaves an endpoint running is the exact shape of accident the €100 target exists to rule out,
# and the ordering here is the only thing standing between a failed run and a monthly bill.

name: capture

# **Six jobs rather than one, and the reason is the cost of being wrong.**
#
# This was a single job with twenty-six steps. A failure at step thirteen meant re-running the
# twelve above it — Flink start, a SageMaker pipeline, six minutes of publishing, a merge — and
# the day this was split, that had happened six times in a row for four different reasons, each
# costing about fifty minutes.
#
# Split into jobs, GitHub's own "Re-run failed jobs" re-runs only what broke. The estate is the
# shared state: the landing prefix and the silver table persist between jobs, so a later stage
# reads what an earlier one produced from S3 rather than from a runner's disk. What cannot travel
# that way — the list of part files that existed before the run, and the decision records — goes
# through artifacts, which is also what makes the dependency visible in the file.
#
#   drive ─┐
#          ├─ aggregate ─┐
#   train ─┼─ decide ────┼─ stop  (always)
#          └─ erase ─────┘
#
# `drive` and `train` do not depend on each other and now run in parallel, which removes about
# twelve minutes from a clean run. Three jobs then fan out from `drive`.
#
# **`stop` needs every other job and runs `if: always()`.** With one job that was a step with the
# same condition; with six it has to be stated as a dependency or a failure in the middle would
# leave Managed Flink running. That is not hypothetical — it happened, for two hours, when an
# expired token made the cleanup step fail while `always()` was faithfully running it.
#
# Each job assumes the role itself, which is a second benefit: no job now approaches the role's
# one-hour session limit, and the credential renewals that were added to work around that inside
# a seventy-minute job are no longer load-bearing.

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long to run the scenario. Kept short; this is billing by the minute."
        required: true
        type: number
        default: 30
      snapshot:
        description: "The Iceberg snapshot the training pipeline pins. No default: a run against yesterday's snapshot is a model nobody can trace."
        required: true
        type: string
      threshold:
        description: "The score at or above which a meter is flagged. No default: zero flags every meter and produces an analysis that is internally consistent and about nothing."
        required: true
        type: string
        default: "700"
      labels:
        description: "Which labels the model is fitted against. `dispatch_log` is what history gives you and the promotion gate REFUSES it, for the label-coverage finding in docs/BIAS-FINDING.md. `randomised_inspection` is what that document's mitigation produces and the gate promotes it. Same population, same model class, same thresholds — the difference is the labels, which is the finding."
        required: true
        type: choice
        options: [dispatch_log, randomised_inspection]
        default: dispatch_log
      approver:
        description: "The named human who reviews the consequential decisions this capture takes. Claim 7 is not that nothing actuates — it is that a named person is the only thing that can, and an unnamed one is not oversight. Leave empty to prove only the refusal."
        required: false
        type: string
        default: ""
      confirm:
        description: "Type `capture` to confirm. This starts billable compute."
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: capture-${{ github.ref }}
  cancel-in-progress: false

jobs:
  drive:
    name: stand up and drive the day
    runs-on: ubuntu-latest
    environment: deploy
    # Ninety, because this job publishes the generated day **twice** — once to drive the
    # scenario and once for claim 2's replay — and the publisher issues one synchronous
    # `Publish` per record at about six a second. The first staged run measured 27.6 minutes for
    # the first pass and was killed at sixty in the middle of the second.
    timeout-minutes: 90

    env:
      PROJECT: watermark
      LAKEHOUSE: watermark-lakehouse-${{ vars.AWS_ACCOUNT_ID }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}

    steps:
      - name: the confirmation word
        run: |
          if [ "${{ inputs.confirm }}" != "capture" ]; then
            echo "::error::Type 'capture' in the confirm field."
            exit 1
          fi
          if [ "${{ inputs.minutes }}" -gt 60 ]; then
            echo "::error::More than an hour is not a capture, it is an environment."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # `data.publish` imports `watermark.core` to normalise what it sends. The workflow drove
      # a checkout and never installed it, so the scenario step died on
      # `No module named 'watermark'` — after the pipeline had succeeded and the endpoint was
      # standing, which is the expensive place to discover a missing pip install.
      - run: pip install -e ".[cloud]"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          # Composed from the account id and the name bootstrap chose. See deploy.yml.
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/watermark-deploy
          aws-region: ${{ vars.AWS_REGION }}

      - name: start the Flink application, unless it is already running
        # `ResourceInUseException: Application cannot be started in 'RUNNING' state` is not a
        # failure — it is the state this step wants. A cancelled run leaves the application up,
        # and refusing to proceed there means the next capture cannot start until somebody stops
        # it by hand, which is the opposite of what an unattended workflow is for.
        #
        # It waits for RUNNING either way, so the steps after this one can assume it.
        run: |
          set -euo pipefail
          status=$(aws kinesisanalyticsv2 describe-application --application-name watermark \
            --query 'ApplicationDetail.ApplicationStatus' --output text)
          echo "flink application: $status"
          # Wait out any transition first. FORCE_STOPPING, STOPPING and UPDATING are all
          # states a previous run can leave behind, and starting from any of them is refused —
          # so an unattended capture would fail on the tail of the one before it.
          for _ in $(seq 1 40); do
            case "$status" in RUNNING|READY|STARTING) break ;; esac
            sleep 15
            status=$(aws kinesisanalyticsv2 describe-application --application-name watermark \
              --query 'ApplicationDetail.ApplicationStatus' --output text)
            echo "  waiting out $status"
          done

          if [ "$status" != "RUNNING" ] && [ "$status" != "STARTING" ]; then
            aws kinesisanalyticsv2 start-application \
              --application-name watermark \
              --run-configuration '{"ApplicationRestoreConfiguration":{"ApplicationRestoreType":"RESTORE_FROM_LATEST_SNAPSHOT"}}'
          fi
          for _ in $(seq 1 40); do
            status=$(aws kinesisanalyticsv2 describe-application --application-name watermark \
              --query 'ApplicationDetail.ApplicationStatus' --output text)
            [ "$status" = "RUNNING" ] && break
            sleep 15
          done
          echo "flink application: $status"
          [ "$status" = "RUNNING" ]

      - name: note what the landing prefix already held
        # **The third set, and the reason claim 2 could not be compared without it.**
        #
        # The landing prefix accumulates across every capture this estate has ever driven. The
        # replay step below takes a copy "before the replay" and one "after", and subtracts the
        # first from the second — which separates the two deliveries of *this* run perfectly, and
        # leaves months of history sitting inside the first.
        #
        # It reported `first run: 9664 published values; replay: 4062` and named four thousand
        # rows the replay had supposedly lost. It had lost nothing: 9,664 was every capture ever
        # run, and the offset normalisation was computed against the oldest interval in the
        # bucket rather than against this run's own first, which put every key on a different
        # axis.
        #
        # A list of names is enough: part files are uniquely named, so subtracting this from both
        # sides leaves exactly what each delivery produced. Nothing is deleted — the history is
        # somebody's evidence, and an assertion that needs the bucket emptied to pass is an
        # assertion nobody should trust.
        run: |
          set -euo pipefail
          mkdir -p out
          { aws s3 ls "s3://${LAKEHOUSE}/landing/meter_interval/" --recursive || true; } \
            | awk '{print $4}' | sed 's#.*/##' | sort -u > out/landing-before.txt
          echo "landing objects already present: $(wc -l < out/landing-before.txt | tr -d ' ')"

      - name: drive the scenario
        # `--live`. Without it `data.publish` prints the plan and touches nothing, which is the
        # right default for a script that can spend money and the wrong one for the workflow
        # whose entire purpose is to spend it. The first capture that reached this step ran dry,
        # printed a plan, exited zero, and the run was reported a success with no record ever
        # reaching Kinesis — the exact shape of "generated but unrun" this project refuses.
        #
        # So the count is asserted afterwards rather than trusted. A publisher that sends
        # nothing and a stream that receives nothing look identical from here.
        run: |
          set -euo pipefail
          echo "Publishing the generated day to IoT Core for ${{ inputs.minutes }} minutes."
          # **The anchor, shared with the seed.** `scripts/seed_reference.py` shifts the
          # reference history by the same arithmetic and used to read its own clock — inside
          # `train`, after the training pipeline, so the two days were however far apart the fit
          # took. Half an hour of that puts `M00019`'s 14:30 tariff change back onto the hour
          # grid, and the gold layer's no-boundary test fails for a reason that has nothing to
          # do with the settlement.
          #
          # The replay below deliberately takes no anchor: claim 2 measures the offset between
          # two deliveries, and two at the same instant would exercise nothing.
          #
          # Seeded *here*, immediately before the publisher, and not only in `train`. `aggregate`
          # depends on `drive` alone, so the gold layer could be built against whatever the
          # deploy-time seed had left — a day computed an hour earlier — while `train` was still
          # fitting. That is the race the tariff boundary kept losing.
          python scripts/seed_reference.py \
            --project "$PROJECT" \
            --region "$AWS_DEFAULT_REGION" \
            --warehouse "s3://${LAKEHOUSE}/warehouse" \
            --anchor "${{ inputs.snapshot }}"

          python -m data.publish --minutes "${{ inputs.minutes }}" \
            --anchor "${{ inputs.snapshot }}" --live | tee /tmp/publish.log
          grep -qE 'published [0-9,]+ deliveries' /tmp/publish.log || {
            echo "::error::the publisher reported no deliveries"; exit 1; }

      - name: let the landing files roll and commit
        # A closed window is not a readable row yet. Flink's `FileSink` rolls a part file on
        # `LANDING_ROLLOVER` (a minute) or `LANDING_IDLE` (thirty seconds of quiet), and a rolled
        # file is *pending* until the next successful checkpoint — sixty seconds apart. Merging
        # before both have happened reads whatever happened to be committed and reports it as
        # the capture's output, which is the same shape of quiet wrongness as a publisher that
        # sends nothing.
        #
        # Three minutes covers a rollover, an idle interval and two checkpoints.
        run: |
          set -euo pipefail
          sleep 180
          # `|| true` for the same reason as the capture poll below: an empty prefix is an
          # exit status, and under `pipefail` it ends the step with no message instead of
          # reaching the assertion written to catch exactly that.
          landed=$( { aws s3 ls "s3://${LAKEHOUSE}/landing/meter_interval/" --recursive || true; } | wc -l )
          echo "landing objects: $landed"
          [ "$landed" -gt 0 ] || { echo "::error::nothing landed; the stream closed no window"; exit 1; }

      - name: merge the landed windows into the lakehouse
        # Claim 2's other half, and the leg that has never run to completion. The streaming job
        # decides when a window closes; this is what makes the decision a row that settlement can
        # total, erasure can delete and a restatement can supersede.
        run: |
          set -euo pipefail
          # Noted before the merge, so the assertions below can ask about *this* run.
          #
          # The silver table accumulates across every capture the estate has ever driven, and the
          # first version of those assertions queried all of it. That conflates two different
          # questions — "was this run correct" and "was every run ever correct" — and it answers
          # the second, which no run can ever make true again once anything has gone wrong. A
          # defect fixed in the core leaves its rows behind, and the assertion then fails for ever
          # on history rather than on behaviour.
          #
          # `merged_at` is set by the merge job to `CURRENT_TIMESTAMP()`, so a bound taken here
          # scopes every count to the rows this capture landed. The older rows stay in the table,
          # which is correct: doctrine 4 says a correction never erases what was previously
          # stated, and that applies to the record of a defect as much as to a meter reading.
          echo "MERGE_FROM=$(date -u +%Y-%m-%dT%H:%M:%S)" >> "$GITHUB_ENV"
          run_id=$(aws glue start-job-run --job-name watermark-land-to-silver \
            --query JobRunId --output text)
          echo "land-to-silver $run_id"
          settled=""
          for _ in $(seq 1 60); do
            state=$(aws glue get-job-run --job-name watermark-land-to-silver \
              --run-id "$run_id" --query 'JobRun.JobRunState' --output text)
            echo "  $state"
            case "$state" in
              SUCCEEDED) settled="yes"; break ;;
              FAILED|ERROR|TIMEOUT|STOPPED)
                aws glue get-job-run --job-name watermark-land-to-silver --run-id "$run_id" \
                  --query 'JobRun.ErrorMessage' --output text
                echo "::error::land-to-silver $state"; exit 1 ;;
            esac
            sleep 15
          done
          # A loop that ran out is a merge that did not happen. See the pipeline wait above.
          [ -n "$settled" ] || { echo "::error::land-to-silver never settled"; exit 1; }

      - name: the lakehouse holds what the stream decided
        # **The assertions this workflow existed without.** Every step before this one reported
        # success for a run that moved zero records, because nothing compared an outcome against
        # an expectation — the failure decision 17 names and the one this project argues against.
        #
        # Four facts, each falsifiable, each about a different claim:
        #
        #   rows            — the merge produced something at all.
        #   closed_at       — claim 1, checkable in SQL: a row published with a watermark
        #                     earlier than its own interval end could not have come from the
        #                     core. Zero such rows is the assertion; one is a build failure.
        #   lineage ids     — claim 2's identity, present on every row and distinct per revision.
        #   restatements    — doctrine 4: the three-day-late file changed a published total and
        #                     the row says what it superseded rather than having overwritten it.
        #
        # The edge case is asserted separately, in the step below, because it is not a property
        # of a row: SUB-03's forty-minute silence produces `held_back`, and `held_back` means
        # *no window closed*. There is nothing in the table to look at, which is the whole
        # difficulty of proving claim 1 from its output.
        run: |
          set -euo pipefail
          mkdir -p out/capture

          athena() {
            local qid
            qid=$(aws athena start-query-execution --work-group "$PROJECT" \
              --query-string "$1" --query QueryExecutionId --output text)
            for _ in $(seq 1 60); do
              local state
              state=$(aws athena get-query-execution --query-execution-id "$qid" \
                --query 'QueryExecution.Status.State' --output text)
              case "$state" in
                SUCCEEDED) aws athena get-query-results --query-execution-id "$qid" \
                             --query 'ResultSet.Rows[1:].Data[*].VarCharValue' --output text
                           return 0 ;;
                FAILED|CANCELLED)
                  aws athena get-query-execution --query-execution-id "$qid" \
                    --query 'QueryExecution.Status.StateChangeReason' --output text >&2
                  return 1 ;;
              esac
              sleep 3
            done
            echo "athena query did not settle" >&2; return 1
          }

          # Captured first, so a query that fails stops here with Athena's own reason instead of
          # feeding empty strings into the assertions below. The previous run reported "the merge
          # produced no rows" and two `integer expression expected` errors from bash, when what
          # had actually happened was `COLUMN_NOT_FOUND: ... or requester is not authorized` — a
          # Lake Formation grant, described as an arithmetic problem.
          facts=$(athena "
            SELECT COUNT(*),
                   COUNT_IF(closed_at < interval_start + INTERVAL '15' MINUTE),
                   COUNT(DISTINCT lineage_id),
                   COUNT_IF(restatement_cause IS NOT NULL),
                   COUNT_IF(restatement_cause IS NOT NULL AND supersedes IS NOT NULL),
                   COUNT(DISTINCT watermark_status)
            FROM ${PROJECT}_silver.meter_interval
            WHERE merged_at >= TIMESTAMP '${MERGE_FROM/T/ }'") || {
            echo "::error::the lakehouse could not be queried; the assertions below were not run"
            exit 1
          }
          # Printed before it is parsed, and split by field rather than by `read`. The previous
          # run failed this step with no output at all: `read` consuming a short or empty line
          # under `set -e` ends the script silently, so a query problem and a parsing problem
          # were indistinguishable — from a step whose whole purpose is to say what happened.
          echo "athena returned: [$facts]"
          set -- $facts
          [ "$#" -eq 6 ] || {
            echo "::error::expected six counts from Athena, got $#: [$facts]"; exit 1; }
          ROWS=$1 UNCLOSED=$2 LINEAGE=$3 RESTATED=$4 SUPERSEDED=$5 STATUSES=$6

          {
            echo "### The lakehouse after the capture"
            echo ""
            echo "| fact | value |"
            echo "|---|---|"
            echo "| rows merged | $ROWS |"
            echo "| rows closed before their interval ended | $UNCLOSED |"
            echo "| distinct lineage ids | $LINEAGE |"
            echo "| rows that are restatements | $RESTATED |"
            echo "| restatements naming what they replaced | $SUPERSEDED |"
            echo "| distinct watermark statuses | $STATUSES |"
          } >> "$GITHUB_STEP_SUMMARY"

          fail=0
          [ "$ROWS" -gt 0 ] || { echo "::error::the merge produced no rows"; fail=1; }
          [ "$UNCLOSED" = "0" ] || { echo "::error::claim 1: $UNCLOSED rows were published with a watermark earlier than their own interval end"; fail=1; }
          [ "$LINEAGE" = "$ROWS" ] || { echo "::error::claim 2: $ROWS rows carry $LINEAGE distinct lineage ids"; fail=1; }
          [ "$RESTATED" -gt 0 ] || { echo "::error::doctrine 4: the late batch restated nothing. Either it never arrived, or a correction overwrote instead of superseding"; fail=1; }
          # **Counted by `restatement_cause`, not by `revision > 0`**, and the difference is a
          # third kind of row this assertion did not know about.
          #
          # The core emits `published`, `restated` and `confirmed`. A *confirmation* is late data
          # that arrived and did not change the number — `windows.py` refuses to call that a
          # revision, because restating a value to itself puts a meaningless row in a settlement
          # report and trains whoever reads it to skim revisions. It keeps the previous revision
          # number and carries no `supersedes`, correctly: it superseded nothing.
          #
          # Counting `revision > 0` therefore swept up every confirmation of an already-restated
          # window and demanded it name what it replaced. The live run reported "3464
          # restatements, only 3409 of which say what they replaced" — fifty-five rows that were
          # not restatements at all, on an assertion whose failure reads like doctrine 4 being
          # broken.
          [ "$SUPERSEDED" = "$RESTATED" ] || { echo "::error::doctrine 4: $RESTATED restatements, only $SUPERSEDED of which say what they replaced"; fail=1; }
          exit $fail

      - name: renew the credentials before the second half
        # **The role's maximum session is one hour and this capture is now longer than that.**
        #
        # `infra/bootstrap/oidc.tf` sets `max_session_duration = 3600`, so a longer token cannot
        # be requested — and raising it would mean applying the one layer that applies from a
        # laptop, to work around a workflow that can simply ask again. Assuming the role a second
        # time costs one OIDC exchange and leaves the infrastructure alone.
        #
        # **Placed before claim 2, not after it**, and the first version had it the wrong side.
        # That step publishes the whole generated day a *second* time, which is what took this
        # capture from forty minutes to seventy — so renewing afterwards renews for everything
        # except the step that needed it. The replay's publish failed with
        # `ForbiddenException` from IoT Core, which is what an expired token looks like on
        # `iot-data`: no mention of a token anywhere in the message.
        #
        # Renew before the long step, not after. The other renewal, immediately before the
        # cleanup, stays where it is for the same reason in reverse: whatever happens above it,
        # the thing that stops the billing must have credentials.
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/watermark-deploy
          aws-region: ${{ vars.AWS_REGION }}

      - name: "claim 2 — the same day, delivered twice, publishes the same values"
        # **What every capture already asserted, and why it was not claim 2.**
        #
        # Each run checks that published rows carry lineage ids, that the ids are distinct, and
        # that restatements name what they replaced. Those are properties of *one* run. Claim 2
        # is a statement about two: the same events, shuffled, duplicated and delivered late,
        # produce identical output. No single run can exhibit that however many invariants it
        # satisfies — and `evals/replay/` proves it over the pure *core*, which leaves exactly
        # this gap. The core is deterministic by construction; a Kinesis shard, a Flink
        # checkpoint and an S3 listing are the parts that might not be.
        #
        # The first delivery is the one the steps above already drove and landed. This replays
        # the same generated day a second time and compares what came out. The publisher shifts
        # the day to end at *now*, so the second delivery lands on different intervals — the
        # comparison is therefore keyed on the interval each run produced rather than on a shared
        # timestamp, which is why `replay_live.py` compares values per key and not files.
        run: |
          set -euo pipefail
          # Copied here rather than reused from a previous step. The first version moved
          # `out/landing`, which the *evidence* step creates — and that step runs after this one,
          # so the first live run of this comparison died on `mv: cannot stat 'out/landing'`
          # before publishing anything. A step that depends on a directory another step happens
          # to leave behind is a step that breaks when somebody reorders them.
          mkdir -p out/landing-first out/landing-second
          aws s3 cp "s3://${LAKEHOUSE}/landing/meter_interval/" out/landing-first \
            --recursive --exclude "*_tmp_*" --quiet

          # The same snapshot, as a list of names, for the case matrix in the `decide` job.
          # `landing-before.txt` bounds the evidence at the start of the capture; this bounds it
          # at the end of the *first* delivery, and the matrix needs both — the replay below
          # publishes a second, shifted copy of the same day, and a matrix reading two days is
          # asking a different question from the one its cases are written for.
          find out/landing-first -type f -exec basename {} \; | sort -u > out/landing-first.txt
          echo "first delivery: $(wc -l < out/landing-first.txt | tr -d ' ') part files"

          python -m data.publish --minutes "${{ inputs.minutes }}" --live
          sleep 180

          # Everything, including the first run's files. The comparison subtracts them by name,
          # which is how the two deliveries are separated without clearing a bucket the rest of
          # the capture is still reading from.
          aws s3 cp "s3://${LAKEHOUSE}/landing/meter_interval/" out/landing-second \
            --recursive --exclude "*_tmp_*" --quiet
          python scripts/replay_live.py \
            --before out/landing-before.txt \
            --first out/landing-first \
            --after out/landing-second

      - name: the invariants the stream core guarantees, checked against the deployed table
        # **The ruleset was declared, applied and never once evaluated.** It has sat attached to
        # `silver.meter_interval` for the whole life of the lakehouse: six rules, a Terraform
        # resource, a clean plan, and not a single row ever compared against a single rule.
        #
        # It runs here rather than in `deploy` because there is nothing to evaluate until the
        # merge has landed rows — a ruleset against an empty table passes every rule it has,
        # which is the shape of green this project spends most of its effort refusing.
        #
        # The role is the maintenance role, not the deploy role: Glue assumes it to read the
        # table, and it is the principal that already holds the Lake Formation grants. Handing
        # this the deploy role would mean widening the one credential in the estate that can
        # change infrastructure, in order to read six columns.
        run: |
          set -euo pipefail

          status=0
          python scripts/evaluate_quality.py \
            --ruleset "${PROJECT}-meter-interval" \
            --database "${PROJECT}_silver" \
            --table meter_interval \
            --role "arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${PROJECT}-lakehouse-maintenance" \
            > quality.md 2>&1 || status=$?

          # The log and the summary both, rather than a redirect into one of them. A failed rule
          # names the invariant that broke, and reading it should not require opening the run's
          # summary page.
          cat quality.md
          cat quality.md >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - uses: actions/upload-artifact@v4
        with:
          name: landing-before
          path: |
            out/landing-before.txt
            out/landing-first.txt
          if-no-files-found: error


  train:
    name: train a candidate and register who was in it
    runs-on: ubuntu-latest
    environment: deploy
    timeout-minutes: 45

    env:
      PROJECT: watermark
      LAKEHOUSE: watermark-lakehouse-${{ vars.AWS_ACCOUNT_ID }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}

    steps:
      - name: the confirmation word
        run: |
          if [ "${{ inputs.confirm }}" != "capture" ]; then
            echo "::error::Type 'capture' in the confirm field."
            exit 1
          fi
          if [ "${{ inputs.minutes }}" -gt 60 ]; then
            echo "::error::More than an hour is not a capture, it is an environment."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # `data.publish` imports `watermark.core` to normalise what it sends. The workflow drove
      # a checkout and never installed it, so the scenario step died on
      # `No module named 'watermark'` — after the pipeline had succeeded and the endpoint was
      # standing, which is the expensive place to discover a missing pip install.
      - run: pip install -e ".[cloud]"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          # Composed from the account id and the name bootstrap chose. See deploy.yml.
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/watermark-deploy
          aws-region: ${{ vars.AWS_REGION }}

      - name: run the training pipeline and wait for it
        # Before the endpoint, deliberately. The endpoint serves a model a *human* approved, so
        # the pipeline that produces the candidate has to have finished — and a pipeline that
        # fails should fail while nothing is serving and nothing is billing by the minute.
        run: |
          set -euo pipefail
          execution=$(aws sagemaker start-pipeline-execution \
            --pipeline-name watermark-anomaly-training \
            --pipeline-parameters \
              Name=SnapshotId,Value="${{ inputs.snapshot }}" \
              Name=AsOfInstant,Value="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              Name=Threshold,Value="${{ inputs.threshold }}" \
              Name=LabelSource,Value="${{ inputs.labels }}" \
            --query PipelineExecutionArn --output text)
          echo "PIPELINE_EXECUTION=$execution" >> "$GITHUB_ENV"
          echo "waiting on $execution"

          # **A loop that runs out is a failure, not a pass.** This waited thirty minutes for
          # `Succeeded`, and if the pipeline was still `Executing` at the end the loop simply
          # ended and the step reported success — so a pipeline that hung produced a green
          # capture, an endpoint step that found no model, and a run whose summary said
          # everything worked. That is the same shape as the publisher that sent nothing and
          # exited zero, which is the failure `docs/DECISIONS.md` 17 names.
          settled=""
          for _ in $(seq 1 60); do
            status=$(aws sagemaker describe-pipeline-execution \
              --pipeline-execution-arn "$execution" \
              --query PipelineExecutionStatus --output text)
            echo "  $status"
            case "$status" in
              Succeeded) settled="yes"; break ;;
              Failed|Stopped) echo "::error::pipeline $status"; exit 1 ;;
            esac
            sleep 30
          done
          [ -n "$settled" ] || {
            aws sagemaker list-pipeline-execution-steps --pipeline-execution-arn "$execution" \
              --query 'PipelineExecutionSteps[].[StepName,StepStatus]' --output text
            echo "::error::the pipeline was still running after thirty minutes. Not treating that as a pass"
            exit 1
          }

      - name: register who was in that training set
        # **The register claim 6 deletes from, written by the run that produced the training
        # set.** `scripts/seed_reference.py` lands the reference tables at deploy time and
        # deliberately leaves the membership empty: a training-set membership describes a
        # *training run*, and registering one at deploy time would record a training set nobody
        # has trained.
        #
        # This is that run. The snapshot id is the one the pipeline was given, so the register
        # says which subjects were in which training set — which is what makes the erasure's
        # training-set leg a deletion of something rather than a query against an empty table,
        # and what would let the quarantine leg name the models a subject actually reached.
        run: |
          set -euo pipefail
          python scripts/seed_reference.py \
            --project "$PROJECT" \
            --region "$AWS_DEFAULT_REGION" \
            --warehouse "s3://${LAKEHOUSE}/warehouse" \
            --snapshot "${{ inputs.snapshot }}" \
            --anchor "${{ inputs.snapshot }}" \
            --labels "${{ inputs.labels }}" \
            --snapshot-only


  aggregate:
    name: build the gold layer
    needs: [drive]
    runs-on: ubuntu-latest
    environment: deploy
    timeout-minutes: 30

    env:
      PROJECT: watermark
      LAKEHOUSE: watermark-lakehouse-${{ vars.AWS_ACCOUNT_ID }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # `data.publish` imports `watermark.core` to normalise what it sends. The workflow drove
      # a checkout and never installed it, so the scenario step died on
      # `No module named 'watermark'` — after the pipeline had succeeded and the endpoint was
      # standing, which is the expensive place to discover a missing pip install.
      - run: pip install -e ".[cloud]"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          # Composed from the account id and the name bootstrap chose. See deploy.yml.
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/watermark-deploy
          aws-region: ${{ vars.AWS_REGION }}

      - name: build the gold layer, which no capture had ever built
        # **The settlement path, run for the first time.**
        #
        # `pipelines/dbt/` has held these models since phase 2 — hourly totals per meter, per
        # balancing group, the unattributed reconciliation — and no capture ever ran dbt. So
        # `gold.settlement_hour` did not exist, the ruleset that used to name it could not be
        # applied (`infra/governance/quality.tf` says so in as many words), and two of the three
        # decisions this platform declares had never produced a number.
        #
        # It runs after the merge, because it aggregates what the stream published, and before
        # the claim harnesses, because `settlement_priced` is where the tariff change becomes a
        # figure somebody could be billed.
        #
        # `dbt build`, not `dbt run`: build runs the tests with the models, so a source that
        # arrived with a null lineage id or a duplicate meter-interval-revision fails here rather
        # than being aggregated into a total that looks fine.
        env:
          WATERMARK_LAKEHOUSE_BUCKET: ${{ env.LAKEHOUSE }}
          WATERMARK_REGION: ${{ vars.AWS_REGION }}
          WATERMARK_PROJECT: ${{ env.PROJECT }}
          # Absolute, because the step below `cd`s into this same directory and a relative path
          # would then resolve from inside it — `Path 'pipelines/dbt' does not exist`, from a
          # step standing in `pipelines/dbt`.
          DBT_PROFILES_DIR: ${{ github.workspace }}/pipelines/dbt
        run: |
          set -euo pipefail
          pip install -e ".[dbt]" >/dev/null
          cd pipelines/dbt
          dbt deps
          # **`--full-refresh`, because these models are incremental and the estate is not.**
          #
          # `settlement_priced` inner-joins the tariff point-in-time, so an hour with no tariff in
          # force produces no row. Rows built under an earlier, shorter seed stay exactly as they
          # were built — an incremental model does not revisit them — so 396 unpriced hours
          # survived the seed being extended to cover them, and the test written to catch them
          # went on reporting the same number.
          #
          # These are four small aggregates over one day. Rebuilding them costs seconds and makes
          # every capture's gold layer a statement about the data as it stands rather than about
          # the order in which captures happened to run.
          status=0
          dbt build --target deployed --full-refresh || status=$?

          {
            echo ""
            echo "### The gold layer"
            echo ""
            echo '```'
            tail -20 logs/dbt.log 2>/dev/null | sed 's/\x1b\[[0-9;]*m//g' || echo "(no dbt log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # **A failing dbt test says "Got 1 result" and stops.** Which row, on which meter, in
          # which hour — none of it is printed, and the rows live behind Lake Formation, so
          # nobody outside this job can go and look. Diagnosing one costs a whole capture.
          #
          # The compiled SQL of every test is sitting in `target/`. On a failure, run the ones
          # that failed and print what they returned. This is the same lesson the live case
          # matrix learnt: a check that spends an hour to say "no" and nothing else has spent
          # the hour badly.
          if [ "$status" -ne 0 ]; then
            echo ""
            echo "── the rows the failing tests returned ──"
            sed 's/\x1b\[[0-9;]*m//g' logs/dbt.log \
              | grep -oE "in test [a-z0-9_]+ \(tests/[a-z0-9_/]+\.sql\)" \
              | sed -E "s#in test [a-z0-9_]+ \(##; s#\)##" | sort -u \
              | while read -r relative; do
                  compiled="target/compiled/watermark/${relative}"
                  [ -f "$compiled" ] || { echo "  ${relative}: no compiled SQL found"; continue; }
                  echo ""
                  echo "  ${relative}:"
                  qid=$(aws athena start-query-execution \
                    --work-group "$PROJECT" \
                    --query-string "$(cat "$compiled")" \
                    --query QueryExecutionId --output text)
                  for _ in $(seq 1 40); do
                    state=$(aws athena get-query-execution --query-execution-id "$qid" \
                      --query 'QueryExecution.Status.State' --output text)
                    case "$state" in SUCCEEDED|FAILED|CANCELLED) break;; esac
                    sleep 3
                  done
                  if [ "$state" = "SUCCEEDED" ]; then
                    aws athena get-query-results --query-execution-id "$qid" --max-items 20 \
                      --query 'ResultSet.Rows[].Data[].VarCharValue' --output text \
                      | tr '\t' '|' | sed 's/^/    /'
                  else
                    echo "    could not re-run it: $(aws athena get-query-execution \
                      --query-execution-id "$qid" \
                      --query 'QueryExecution.Status.StateChangeReason' --output text)"
                  fi
                done
          fi
          exit $status


  decide:
    name: serve, compare and decide
    needs: [drive, train]
    runs-on: ubuntu-latest
    environment: deploy
    timeout-minutes: 45

    env:
      PROJECT: watermark
      LAKEHOUSE: watermark-lakehouse-${{ vars.AWS_ACCOUNT_ID }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # `data.publish` imports `watermark.core` to normalise what it sends. The workflow drove
      # a checkout and never installed it, so the scenario step died on
      # `No module named 'watermark'` — after the pipeline had succeeded and the endpoint was
      # standing, which is the expensive place to discover a missing pip install.
      - run: pip install -e ".[cloud]"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          # Composed from the account id and the name bootstrap chose. See deploy.yml.
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/watermark-deploy
          aws-region: ${{ vars.AWS_REGION }}

      - uses: actions/download-artifact@v4
        with:
          name: landing-before
          path: out

      - name: start the endpoint, if there is one
        # The one resource in this estate that bills by the minute for as long as it exists.
        #
        # **There is deliberately none on a first capture.** The endpoint serves a model a human
        # approved, and on the first run through this workflow no model has been registered yet,
        # let alone approved — so `deploy.yml` was applied with `endpoint_enabled = false` and
        # this step has nothing to start. Failing here would be the workflow refusing to run the
        # very pipeline that produces the first candidate.
        #
        # So: absent is a legitimate state and is reported, not an error. Present means someone
        # made a deliberate second deploy after approving a model, and then it is waited for.
        #
        # **And a `Failed` endpoint is a third state, which cost a capture to learn.** A deploy
        # asking for an endpoint against a model artefact that does not exist — a fresh account
        # after a destroy, with `promoted_model` still filled in from habit — leaves one behind
        # in `Failed`. It serves nothing and bills nothing, and `describe-endpoint` succeeds on
        # it, so the branch below read "present" and waited for `InService`, which is a state it
        # can never reach. `Waiter EndpointInService failed` and the capture stopped four steps
        # in, on a leftover.
        #
        # So the *status* is read rather than the existence. A failed endpoint is removed and the
        # capture continues without one, which is the honest outcome: there is nothing to serve
        # from, and refusing to run the pipeline that produces the next candidate would make the
        # workflow unable to recover from its own earlier failure.
        run: |
          set -euo pipefail
          status=$(aws sagemaker describe-endpoint --endpoint-name watermark-anomaly \
            --query EndpointStatus --output text 2>/dev/null || echo absent)
          echo "endpoint status: $status"

          case "$status" in
            absent)
              echo "ENDPOINT_STARTED=no" >> "$GITHUB_ENV"
              echo "::notice::no endpoint — this capture exercises the pipeline, not serving. Approve a model and redeploy with promoted_model set to capture inference."
              ;;
            InService|Creating|Updating)
              aws sagemaker wait endpoint-in-service --endpoint-name watermark-anomaly
              echo "ENDPOINT_STARTED=yes" >> "$GITHUB_ENV"
              aws sagemaker describe-endpoint --endpoint-name watermark-anomaly \
                --query '{status:EndpointStatus,config:EndpointConfigName}' --output json
              ;;
            *)
              # Failed, OutOfService, RollingBack, Deleting. None of them will become InService,
              # and the reason is on the endpoint rather than in this workflow.
              aws sagemaker describe-endpoint --endpoint-name watermark-anomaly \
                --query FailureReason --output text || true
              echo "::warning::the endpoint is $status, so it is being removed and this capture runs without serving. The reason is printed above; the usual cause is a deploy that asked for an endpoint before a model was approved."
              aws sagemaker delete-endpoint --endpoint-name watermark-anomaly || true
              echo "ENDPOINT_STARTED=no" >> "$GITHUB_ENV"
              ;;
          esac

      - name: the endpoint answers, and the answer is recorded
        # **An endpoint that exists and has never been asked anything is the same shape as a
        # green run that moved no records.** `deploy` creates it, `describe-endpoint` says
        # `InService`, and none of that establishes that it serves.
        #
        # Two features, in the order the training channel was written: `score` then
        # `deprivation_decile`, label-first and headerless, which is what the built-in XGBoost
        # image reads. A payload in the wrong shape gets an answer anyway — the container will
        # score whatever it is handed — so the order is taken from the training data rather
        # than assumed.
        #
        # The response is checked for being a probability, not for being non-empty. And the
        # *capture* is checked separately: `data_capture_config` writes the request and the
        # response to `model-capture/anomaly`, which is what AI Act Art. 12 asks for, and a
        # serving path whose audit trail is empty is one no investigation can reach.
        if: env.ENDPOINT_STARTED == 'yes'
        run: |
          set -euo pipefail
          mkdir -p out/capture
          printf '820,0' > out/capture/payload.csv
          aws sagemaker-runtime invoke-endpoint \
            --endpoint-name "${PROJECT}-anomaly" \
            --content-type text/csv \
            --body fileb://out/capture/payload.csv \
            out/capture/inference.txt > out/capture/invoke.json
          score=$(cat out/capture/inference.txt)
          echo "the endpoint scored $score for score=820, decile=0"

          python3 -c "
          import sys
          value = float(open('out/capture/inference.txt').read().strip())
          if not 0.0 <= value <= 1.0:
              sys.exit(f'::error::the endpoint answered {value}, which is not a probability')
          print(f'a probability: {value}')
          "

          # Written asynchronously, and SageMaker buffers before flushing. Five minutes with a
          # poll rather than one flat sleep: a fixed wait that is too short reports a permissions
          # problem and a timing problem identically, which cost a run to find out.
          # **`aws s3 ls` exits 1 on an empty prefix**, and with `set -o pipefail` that status
          # survives the pipe into `wc -l`, so the assignment fails and `set -e` ends the step —
          # before the echo below, which is why the log showed the inference succeeding and then
          # nothing at all. The capture had landed sixty-eight seconds later; the run reported
          # its absence, and the absence was the shell's.
          #
          # `|| true` inside the substitution, so an empty listing is the zero it means rather
          # than an error. The check that the count is greater than zero is two lines down and
          # is where an empty prefix is supposed to be caught.
          captured=0
          for _ in $(seq 1 20); do
            captured=$( { aws s3 ls "s3://${LAKEHOUSE}/model-capture/" --recursive || true; } | wc -l )
            if [ "$captured" -gt 0 ]; then break; fi
            sleep 15
          done
          echo "capture objects: $captured"
          [ "$captured" -gt 0 ] || {
            echo "::error::the endpoint answered and nothing was recorded. Art. 12 asks for the inputs as served, and an inference with no record is one no investigation can reach"
            exit 1; }

      - name: "claim 3 and claim 4 — two mechanisms, one contract, no tolerance"
        # **The claim the README calls the one nothing else in the portfolio proves**, against
        # the estate instead of against a model of it.
        #
        # `evals/parity/` proves it offline every CI run. What it cannot prove is that the
        # *deployed* mechanisms are the two the argument is about: an `as_of` query Athena
        # recomputes whole over Iceberg, and an incremental aggregator that saw each record
        # once, wrote to the Feature Store, and is read back with `GetRecord`. This runs both
        # and compares them as integers, because the contract declares a scale and ADR-0004
        # forbids a tolerance.
        #
        # Claim 4 rides on the same fetch: a served value older than the contract's freshness
        # budget is one a decision must refuse, and the count is reported on every run.
        #
        # It needs the online store, which `deploy` creates only when asked. With it off there
        # is no online side at all, and this step says so rather than passing over an absence.
        #
        # **All three features, not one.** For most of this project's life only
        # `meter_consumption_1h` was compared, and the two substation features were never served
        # at all — their source table was a Glue catalogue entry with no writer, so an as-of
        # query over it returned zero rows and reported no error. Claim 3 was true about a third
        # of the feature set and read as though it were true about all of it.
        run: |
          set -euo pipefail

          # Land the telemetry first. The substation features read `gold.substation_telemetry`,
          # and until this step existed nothing in the repository put a row in it.
          python scripts/land_telemetry.py \
            --bucket "$LAKEHOUSE" \
            --database "${PROJECT}_gold" \
            --workgroup "$PROJECT" \
            --warehouse "s3://${LAKEHOUSE}/warehouse" \
            --since "${{ inputs.snapshot }}"

          # Each feature separately, and the loop does not swallow a failure: a divergence on the
          # second must fail the step even though the first agreed.
          fail=0
          # `M00007` is the meter the erasure targets. Once a capture on this estate has run
          # the erasure, that meter's online record is tombstoned with an event time no
          # re-materialisation can overtake — SageMaker's DeleteRecord is a soft delete — so a
          # second capture reports it missing and claim 3 fails on an erasure that worked.
          #
          # Excluded rather than tolerated: the comparison stays twenty entities wide, and
          # nothing here is asking the erasure to be undone.
          compare() {
            python scripts/parity_live.py \
              --feature "$1" \
              --feature-group "${PROJECT}-$2" \
              --database "${PROJECT}_$3" \
              --workgroup "$PROJECT" \
              --exclude "M00007" \
              --region "$AWS_DEFAULT_REGION" || fail=1
          }

          compare meter_consumption_1h    meter-consumption silver
          compare substation_load_15m     substation-load   gold
          compare substation_headroom_15m substation-load   gold

          [ "$fail" -eq 0 ] || {
            echo "::error::claim 3 does not hold for every feature the contracts declare"
            exit 1; }

      - name: the silent substation held the watermark back, and said so
        # **Claim 1's edge case, and the one the README listed as never induced in the cloud.**
        #
        # SUB-03's comms drop for forty minutes in the generated day. The meters keep metering
        # and buffer; the partition simply says nothing. What must happen is that the watermark
        # stops — `held_back`, with SUB-03 named — and that **no window closes** while it does.
        #
        # That last part is why this cannot be asserted from the table. A held-back watermark
        # publishes nothing, so the evidence for it is an absence, and an absence is exactly
        # what a run that never started also produces. The status lines are what make the two
        # distinguishable: the job reports its watermark condition on every transition, so a
        # grid that is holding back says so, on the record, with the substation that is doing
        # it.
        #
        # Read from the landing prefix rather than from CloudWatch, because these are the same
        # bytes the merge job reads and skips — one source of evidence rather than two that can
        # disagree.
        run: |
          set -euo pipefail
          mkdir -p out/capture out/landing
          # Copied to a directory, then read. `aws s3 cp <prefix> -` streams to stdout and
          # `--recursive` is not compatible with streaming:
          #
          #     An error occurred (ParamValidation): Streaming currently is only compatible
          #     with non-recursive cp commands
          #
          # The error went to stderr, the pipeline produced an empty file, and the step reported
          # "the job never reported a watermark condition at all" — a read that never happened,
          # described as a system that never spoke. The run it said that about had in fact
          # reported nine transitions, one of them `held_back` naming SUB-01.
          aws s3 cp "s3://${LAKEHOUSE}/landing/meter_interval/" out/landing \
            --recursive --exclude "*_tmp_*" --quiet

          # **Only this capture's files.** The landing prefix accumulates across every capture the
          # estate has ever driven — `replay_live.py`'s docstring says so in as many words, and it
          # says so because that prefix once made a comparison report four thousand phantom
          # losses. This step read the whole of it, so a `held_back` transition from *some
          # earlier run* satisfied it. It passed on the run below, where the case matrix — which
          # is scoped — reported no hold-back at all, and the matrix was right.
          #
          # A check that is green because of something that happened last week is worse than a
          # check that is red: it is the same tick with none of the meaning.
          find out/landing -type f | while read -r file; do
            if ! grep -qxF "$(basename "$file")" out/landing-before.txt; then
              cat "$file"
            fi
          done 2>/dev/null \
            | grep '"kind": "watermark"' > out/capture/watermark-status.jsonl || true

          transitions=$(wc -l < out/capture/watermark-status.jsonl | tr -d ' ')
          held=$(grep -c '"status": "held_back"' out/capture/watermark-status.jsonl || true)
          named=$(grep '"status": "held_back"' out/capture/watermark-status.jsonl \
            | grep -cE '"holding_back": "SUB-0[1-9]"' || true)

          {
            echo ""
            echo "### The watermark's own account of itself"
            echo ""
            echo "| fact | value |"
            echo "|---|---|"
            echo "| status transitions reported | $transitions |"
            echo "| transitions into \`held_back\` | $held |"
            echo "| of those, naming the partition holding it | $named |"
          } >> "$GITHUB_STEP_SUMMARY"

          # **What is asserted, and what is only reported.**
          #
          # Asserted: the job reports its watermark condition at all, and every `held_back` it
          # reports names the partition doing it. A held-back watermark that cannot say who is
          # holding it is the half that makes the state useless to an operator.
          #
          # Reported, not asserted: that `held_back` occurred at all. SUB-03's silence is forty
          # minutes of *event* time, and the publisher compresses arrivals 287x, so the gap
          # passes in about eight seconds of wall time. Whether a one-second batch boundary
          # falls inside it is a matter of alignment — it did in three captures out of six —
          # and a check that depends on that is a check that fails for a reason unrelated to
          # the property.
          #
          # The property itself is asserted where it is deterministic: `evals/watermark/`
          # offline, and in the step above, in SQL, where **no row may be published with a
          # watermark earlier than its own interval end**. That is claim 1 as a statement about
          # output rather than about timing, and it holds on every run.
          #
          # Inducing `held_back` deterministically live needs a capture whose compression
          # preserves the gap — four days at 20x is a five-hour run. That is a real limit and
          # it is written down rather than papered over with a flaky assertion.
          fail=0
          [ "$transitions" -gt 0 ] || { echo "::error::the job never reported a watermark condition at all"; fail=1; }
          if [ "$held" -gt 0 ] && [ "$named" -eq 0 ]; then
            echo "::error::the watermark was held back $held times and never named the partition doing it, which is the half that makes it actionable"
            fail=1
          fi
          if [ "$held" -eq 0 ]; then
            echo "::notice::no held_back transition in this capture. The gap is eight seconds of wall time at this compression; claim 1 is asserted in SQL above and proved in evals/watermark/."
          fi
          exit $fail

      - name: the decision layer takes decisions, in the cloud, and none of them actuates
        # **The gap this closes, and it was the largest one left.**
        #
        # `src/watermark/decisions/` is the layer this platform is named around — the engine,
        # the fallback rules, the oversight queue — and nothing in AWS imported it. It was
        # reached by `gate_proof.py`, by the Annex IV generator, and by no running system.
        # Claims 1, 4 and 7 are claims *about decisions*, so every one of them was a statement
        # about a laptop: true, tested, and never once exercised against a watermark a real
        # stream produced, a feature a real Feature Store served, or a score a real endpoint
        # returned. Every defect the first live streaming run turned up — a watermark over the
        # wrong partition key, an adapter dropping five fields, a table that had never existed —
        # was invisible offline for exactly that reason.
        #
        # It runs on the evidence the step above already copied, so the watermark it decides
        # against is the job's own claim about what it has seen and not this step's opinion of
        # it. A decision permitted by the decider's own reading of the watermark is the failure
        # claim 1 is about.
        #
        # `--reviewer` is deliberately the *last* thing it does. Every consequential decision is
        # enqueued and the run first proves that actuating one raises — then, with a named
        # human, that exactly one does. Claim 7 is not "nothing actuates"; it is that a named
        # human is the only thing that can, and both halves have to be shown.
        run: |
          set -euo pipefail
          python scripts/decide_live.py \
            --lakehouse "$LAKEHOUSE" \
            --feature-group "${PROJECT}-meter-consumption" \
            --endpoint "$([ "${ENDPOINT_STARTED:-no}" = "yes" ] && echo "${PROJECT}-anomaly" || echo "")" \
            --region "$AWS_DEFAULT_REGION" \
            --evidence out/landing \
            --out out/capture/decisions \
            --reviewer "${{ inputs.approver }}"

          {
            echo ""
            echo "### The decisions, and what refused to actuate"
            echo ""
            echo '```'
            head -3 out/capture/decisions/decisions.jsonl
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # **Curtailment took a decision, and at least one of them was a throttle.**
          #
          # The decision `CLAUDE.md` lists first and argues high-risk under Annex III(2), and the
          # one that had never been taken: with no telemetry stream the engine ran against
          # `telemetry=None` and withheld every time. `data/telemetry.py` drives SUB-01 past its
          # declared limit on purpose, so a capture that produces no throttle at all means the
          # measurements did not reach the decider — not that the grid was healthy.
          throttles=$(grep -c '"action": "throttle' out/capture/decisions/decisions.jsonl || true)
          echo "curtailment throttles: $throttles"
          [ "$throttles" -gt 0 ] || {
            echo "::error::no throttle in the whole capture. SUB-01 is driven over its limit by design, so this means the telemetry never arrived rather than that nothing needed throttling"
            exit 1; }

          # And every one of them is marked as a fallback, all the way into the record. Doctrine
          # 2: a fallback that reaches the record looking like a model decision is worse than an
          # outage, because it is silent and it trains somebody to trust it.
          unmarked=$(python3 - <<'PY'
          import json
          bad = 0
          for line in open("out/capture/decisions/decisions.jsonl"):
              row = json.loads(line)
              if str(row["action"]).startswith("throttle") and (
                  row["origin"] != "fallback" or not row["unavailable"]):
                  bad += 1
          print(bad)
          PY
          )
          [ "$unmarked" -eq 0 ] || {
            echo "::error::$unmarked throttles reached the record without a fallback marker and a reason"
            exit 1; }

      - name: every case the cast declares is visible in the estate
        # **The live half of `evals/cases/`, and the reason both exist.**
        #
        # That harness drives the generated day through the pure core and proves it sees every
        # defect the cast declares. This asks whether the *deployed* system does — through IoT
        # Core's at-least-once delivery, a Kinesis shard, a Flink checkpoint and a file sink.
        # The difference is not theoretical: every defect this project has found in the cloud was
        # invisible offline, because the two paths meet only in a running estate.
        #
        # Read from the landing evidence rather than from Athena, so the claim is about what the
        # stream emitted and not about what the merge did with it. And scoped by the part files
        # that existed before this capture: the prefix accumulates, and a gap in one run is
        # filled by another run's windows at different intervals — the first ad-hoc run of this
        # matrix failed the evidence-gap case for exactly that reason, on a check that was right.
        run: |
          set -euo pipefail
          python scripts/cases_live.py \
            --landing out/landing \
            --decisions out/capture/decisions/decisions.jsonl \
            --before out/landing-before.txt \
            --first-delivery out/landing-first.txt

      - uses: actions/upload-artifact@v4
        with:
          name: decisions
          path: out/capture/decisions/decisions.jsonl
          if-no-files-found: error


  erase:
    name: an erasure certifies
    # **Last, and this is a race the single-job version could not have.**
    #
    # `erase` deletes a subject's rows from `silver.meter_interval`. `decide` reads the same
    # table through the offline half of the parity comparison, and `aggregate` aggregates it.
    # Made siblings of `drive`, all three ran at once — and the first staged capture failed with
    # `claim 3: 19 agreed, 1 diverged`, the divergence being `M00007: offline None, online 352`.
    #
    # `M00007` is the meter the erasure targets. The offline side found nothing because the rows
    # had just been deleted underneath it; the online store still held what had been materialised
    # a minute earlier. Neither mechanism was wrong and claim 3 was not broken — the harness was
    # reading a table while another job emptied part of it.
    #
    # Parallelising jobs that share mutable state buys wall-clock and pays for it in races. This
    # one is bought back deliberately: `aggregate` and `decide` still run together, and the
    # destructive job waits for both.
    needs: [drive, aggregate, decide]
    runs-on: ubuntu-latest
    environment: deploy
    timeout-minutes: 40

    env:
      PROJECT: watermark
      LAKEHOUSE: watermark-lakehouse-${{ vars.AWS_ACCOUNT_ID }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # `data.publish` imports `watermark.core` to normalise what it sends. The workflow drove
      # a checkout and never installed it, so the scenario step died on
      # `No module named 'watermark'` — after the pipeline had succeeded and the endpoint was
      # standing, which is the expensive place to discover a missing pip install.
      - run: pip install -e ".[cloud]"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          # Composed from the account id and the name bootstrap chose. See deploy.yml.
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/watermark-deploy
          aws-region: ${{ vars.AWS_REGION }}

      - name: an erasure certifies, and takes exactly what it was asked for
        # **Claim 6's positive half, which had never been demonstrated.**
        #
        # The first erasure ever run against a live estate refused to certify. That refusal was
        # the designed behaviour and it was correct — but a claim that has only ever been
        # observed *failing* is not a claim that has been demonstrated. The guard was proved;
        # the mechanism was not. Three separate things were wrong underneath it, and each was
        # invisible to every offline test:
        #
        #   * no per-subject key had ever been created, by anything (ADR-0009);
        #   * `gold` held five Terraform catalogue entries and not one was a table, so a subject
        #     id could not be resolved to the meters it owns;
        #   * the erasure role had Lake Formation and Athena but no grant on the warehouse
        #     prefix, and an Iceberg DELETE rewrites the table's own files.
        #
        # **The subject is the one who took over a meter mid-day, and that is the whole point.**
        # `M00007` changes customer at 10:00 — the scenario's "a meter changes customer".
        # `C00007-NEW` owns its readings from 10:00 onward and nothing before. So this run
        # asserts both halves of a correct erasure in one pass: everything of theirs is gone,
        # and nothing of anybody else's is. The original query said
        # `WHERE meter_id IN (SELECT meter_id ... WHERE customer_id = ?)` and would have erased
        # the whole day — one subject's request destroying another's data, with the certificate
        # reporting that the boundary held. An erasure that over-reaches is a breach in the
        # opposite direction and the harder one to notice, because nobody complains about being
        # forgotten too thoroughly.
        run: |
          set -euo pipefail
          SUBJECT="C00007-NEW"
          PREDECESSOR="C00007"
          METER="M00007"

          athena() {
            id=$(aws athena start-query-execution --query-string "$1" \
              --work-group "$PROJECT" --query QueryExecutionId --output text)
            settled=""
            for _ in $(seq 1 60); do
              state=$(aws athena get-query-execution --query-execution-id "$id" \
                --query 'QueryExecution.Status.State' --output text)
              case "$state" in
                SUCCEEDED) settled="yes"; break ;;
                FAILED|CANCELLED)
                  aws athena get-query-execution --query-execution-id "$id" \
                    --query 'QueryExecution.Status.StateChangeReason' --output text
                  echo "::error::the counting query $state"; exit 1 ;;
              esac
              sleep 3
            done
            [ -n "$settled" ] || { echo "::error::the counting query never settled"; exit 1; }
            aws athena get-query-results --query-execution-id "$id" \
              --query 'ResultSet.Rows[1].Data[0].VarCharValue' --output text
          }

          # **Counted through the same SCD-2 join the erasure resolves with, not against a literal
          # instant.** The publisher shifts the whole scenario day forward so it ends at the
          # moment of the run — that is what makes a capture a replay rather than an archive —
          # so a hardcoded changeover names a moment the live data is nowhere near. The first
          # run of this step reported `116 rows belong to C00007-NEW, 0 to the customer before
          # them` and was right to refuse: every reading had landed on one side of a boundary
          # that belonged to a different day.
          #
          # Resolving the same way the erasure does means the assertion and the thing it is
          # asserting about cannot disagree about when the changeover was, whatever the shift.
          owned() {
            athena "SELECT count(*) FROM ${PROJECT}_silver.meter_interval r
                    JOIN ${PROJECT}_gold.meter_assignment_scd2 a ON a.meter_id = r.meter_id
                    WHERE r.meter_id = '${METER}' AND a.customer_id = '$1'
                      AND r.interval_start >= a.valid_from
                      AND (a.valid_to IS NULL OR r.interval_start < a.valid_to)"
          }

          before_theirs=$(owned "$SUBJECT")
          before_others=$(owned "$PREDECESSOR")
          echo "before: ${before_theirs} rows belong to ${SUBJECT}, ${before_others} to ${PREDECESSOR}"

          # Not asserted as a nicety. With nothing of theirs in the table the erasure would
          # delete nothing, certify, and the assertions below would all pass over an absence —
          # which is the shape of a green test that proves nothing.
          [ "$before_theirs" -gt 0 ] || {
            echo "::error::${SUBJECT} owns no rows, so this run would certify having erased nothing"
            exit 1; }
          [ "$before_others" -gt 0 ] || {
            echo "::error::${PREDECESSOR} owns no rows, so over-deletion could not be detected. The reference seed and the stream are probably on different days"
            exit 1; }

          machine=$(aws stepfunctions list-state-machines \
            --query "stateMachines[?name=='${PROJECT}-erasure'].stateMachineArn" --output text)
          execution=$(aws stepfunctions start-execution --state-machine-arn "$machine" \
            --name "erasure-${GITHUB_RUN_ID}" \
            --input "{\"subject_id\":\"${SUBJECT}\"}" \
            --query executionArn --output text)

          settled=""
          for _ in $(seq 1 80); do
            status=$(aws stepfunctions describe-execution --execution-arn "$execution" \
              --query status --output text)
            case "$status" in
              SUCCEEDED|FAILED|TIMED_OUT|ABORTED) settled="yes"; break ;;
            esac
            sleep 15
          done
          [ -n "$settled" ] || { echo "::error::the erasure never settled"; exit 1; }

          if [ "$status" != "SUCCEEDED" ]; then
            aws stepfunctions describe-execution --execution-arn "$execution" \
              --query '{error:error,cause:cause}' --output json
            aws stepfunctions get-execution-history --execution-arn "$execution" \
              --query 'events[?type==`TaskFailed`].taskFailedEventDetails.cause' --output text \
              | cut -c1-600
            echo "::error::the erasure refused to certify. Every leg has to confirm, and one did not"
            exit 1
          fi

          # The certificate is the artefact, not the exit code. A state machine that succeeded
          # without writing one has satisfied its own control flow and produced no evidence.
          # Braced with `|| true`, because `aws s3 ls` exits non-zero on an empty prefix and
          # `set -o pipefail` would kill the step there — reporting nothing at all instead of
          # reporting zero certificates. That exact mistake cost three captures earlier in this
          # project's history, in a different step, for the same reason.
          certificate=$( { aws s3 ls "s3://${LAKEHOUSE}/erasure-certificates/${SUBJECT}/" --recursive || true; } | wc -l | tr -d ' ')
          [ "$certificate" -gt 0 ] || {
            echo "::error::the erasure succeeded and wrote no certificate"; exit 1; }

          after_theirs=$(owned "$SUBJECT")
          after_others=$(owned "$PREDECESSOR")

          {
            echo ""
            echo "### An erasure, and its boundary"
            echo ""
            echo "| rows on \`${METER}\`, resolved through the SCD-2 join | before | after |"
            echo "|---|---|---|"
            echo "| belonging to \`${SUBJECT}\` | ${before_theirs} | ${after_theirs} |"
            echo "| belonging to \`${PREDECESSOR}\` | ${before_others} | ${after_others} |"
            echo ""
            echo "Certificate objects written: ${certificate}"
          } >> "$GITHUB_STEP_SUMMARY"

          fail=0
          [ "$after_theirs" -eq 0 ] || {
            echo "::error::${after_theirs} of ${SUBJECT}'s rows survived an erasure that certified"; fail=1; }
          [ "$after_others" -eq "$before_others" ] || {
            echo "::error::the erasure took ${SUBJECT}'s rows and $((before_others - after_others)) belonging to ${PREDECESSOR}. Over-deletion is a breach in the other direction"
            fail=1; }
          exit $fail

      # Everything above checks one leg — the lakehouse rows — and takes the other five on the
      # state machine's word. A certificate that verifies its own legs is a signature on a blank
      # page, so this asks the estate the same questions through different services: the shred
      # through KMS, the online store through GetRecord, the training sets through Athena.
      #
      # It is a separate step so that a failure here reads as "the certificate is wrong" rather
      # than as "the erasure failed". They are different findings and the second is much less
      # serious: an erasure that fails loudly is a retry, and a certificate that lies is a
      # statement made to a data subject that was not true.
      - name: every leg, checked against the estate rather than against the certificate
        run: |
          set -euo pipefail

          # Written to a file and appended afterwards rather than piped through `tee`. The
          # default shell here is `bash -e`, not `bash -e -o pipefail`, so a pipe would hand the
          # step `tee`'s exit code and a contradicted leg would pass silently — which is the
          # precise failure this whole step exists to make impossible.
          status=0
          python scripts/erasure_legs_live.py \
            --subject "C00007-NEW" \
            --meters "M00007" \
            --project "$PROJECT" \
            --bucket "$LAKEHOUSE" \
            --workgroup "$PROJECT" > legs.md 2>&1 || status=$?

          cat legs.md
          { echo ""; echo "### Every leg, checked independently"; echo ""; cat legs.md; } \
            >> "$GITHUB_STEP_SUMMARY"
          exit $status


  stop:
    name: stop everything that bills
    needs: [drive, train, aggregate, decide, erase]
    if: always()
    runs-on: ubuntu-latest
    environment: deploy
    timeout-minutes: 30

    env:
      PROJECT: watermark
      LAKEHOUSE: watermark-lakehouse-${{ vars.AWS_ACCOUNT_ID }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # `data.publish` imports `watermark.core` to normalise what it sends. The workflow drove
      # a checkout and never installed it, so the scenario step died on
      # `No module named 'watermark'` — after the pipeline had succeeded and the endpoint was
      # standing, which is the expensive place to discover a missing pip install.
      - run: pip install -e ".[cloud]"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          # Composed from the account id and the name bootstrap chose. See deploy.yml.
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/watermark-deploy
          aws-region: ${{ vars.AWS_REGION }}

      - name: capture the evidence
        run: |
          mkdir -p out/capture
          aws kinesisanalyticsv2 describe-application --application-name watermark \
            > out/capture/application.json
          aws cloudwatch get-metric-statistics \
            --namespace AWS/KinesisAnalytics --metric-name uptime \
            --dimensions Name=Application,Value=watermark \
            --start-time "$(date -u -d '-1 hour' +%Y-%m-%dT%H:%M:%SZ)" \
            --end-time "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --period 60 --statistics Maximum > out/capture/uptime.json

          # The ML half of the evidence. The Clarify report is the artefact an auditor asks
          # for; the monitoring execution is the only proof the schedule ever fired, and a
          # monitoring configuration nobody has seen execute is one nobody knows is wrong.
          aws sagemaker describe-pipeline-execution \
            --pipeline-execution-arn "$PIPELINE_EXECUTION" > out/capture/pipeline.json || true
          aws sagemaker list-pipeline-execution-steps \
            --pipeline-execution-arn "$PIPELINE_EXECUTION" > out/capture/pipeline-steps.json || true
          aws sagemaker list-monitoring-executions \
            --monitoring-schedule-name watermark-anomaly-data-quality \
            > out/capture/monitoring.json || true
          aws sagemaker list-model-packages \
            --model-package-group-name watermark-meter-anomaly \
            > out/capture/model-packages.json || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capture
          path: out/capture

      - name: stop everything that bills
        # `always()`. This is the most important line in the file: a capture that fails halfway
        # and leaves an endpoint running is precisely the accident the cost posture exists to
        # rule out, and a stop step that only runs on success does not prevent it.
        if: always()
        run: |
          # Order matters, and it is by cost per minute descending. The endpoint first: if this
          # step is itself interrupted, the most expensive thing is already gone.
          # **Whatever is there, not whatever this run started.** The guard used to be
          # `ENDPOINT_STARTED = yes`, which is a statement about this workflow's own history
          # rather than about the account — so an endpoint left behind by a *failed deploy* was
          # never anybody's to remove, and the check below then reported it as surviving the
          # cleanup. A teardown that only undoes its own work is not a teardown.
          if aws sagemaker describe-endpoint --endpoint-name watermark-anomaly >/dev/null 2>&1; then
            aws sagemaker delete-endpoint --endpoint-name watermark-anomaly || true
          fi
          # **Whatever is executing, not whatever this run remembers starting.**
          #
          # This read `PIPELINE_EXECUTION`, an environment variable the training step sets. That
          # worked while the capture was one job and stopped working the moment it became six:
          # a variable exported in `train` does not exist in `stop`, so the command ran against
          # the literal string `none` and did nothing — quietly, behind a `|| true`.
          #
          # Asking SageMaker which executions are running is both correct across jobs and more
          # correct in general, for the same reason the endpoint deletion below no longer checks
          # whether *this* run started it: a teardown that only undoes its own work is not a
          # teardown.
          for execution in $(aws sagemaker list-pipeline-executions \
            --pipeline-name "${PROJECT}-anomaly-training" \
            --query "PipelineExecutionSummaries[?PipelineExecutionStatus=='Executing'].PipelineExecutionArn" \
            --output text 2>/dev/null || true); do
            echo "stopping pipeline execution $execution"
            aws sagemaker stop-pipeline-execution --pipeline-execution-arn "$execution" || true
          done
          aws kinesisanalyticsv2 stop-application --application-name watermark --force || true

          # Report what is actually gone rather than what was asked for. `|| true` above keeps
          # one failure from skipping the rest, and the cost of that is that a failed delete is
          # silent — so it is checked here instead.
          remaining=$(aws sagemaker list-endpoints \
            --name-contains watermark-anomaly --query 'Endpoints[].EndpointName' --output text)

          # **And the Flink application, which this step used to assert without looking.**
          #
          # The summary below said "The Flink application is stopped" on the strength of having
          # issued a `stop-application || true` — and on the run where the credentials had
          # expired, that call failed, the sentence was printed anyway, and the application went
          # on consuming KPUs for two hours. A claim about a resource that is not read from the
          # resource is a claim about an API call.
          #
          # Waited on rather than sampled once: `FORCE_STOPPING` is a real state and takes tens
          # of seconds, so a single read straight after the request reports "still running" on a
          # stop that is working perfectly.
          flink="unknown"
          for _ in $(seq 1 20); do
            flink=$(aws kinesisanalyticsv2 describe-application --application-name watermark \
              --query 'ApplicationDetail.ApplicationStatus' --output text 2>/dev/null || echo unreadable)
            case "$flink" in READY|STOPPING|DELETING|unreadable) break ;; esac
            sleep 15
          done

          {
            echo "### Stopped"
            echo ""
            echo "| resource | state |"
            echo "|---|---|"
            echo "| endpoint | ${remaining:-deleted} |"
            echo "| Flink application | $flink |"
            echo ""
            if [ -n "$remaining" ]; then
              echo ":warning: **an endpoint is still there**: \`$remaining\`. It bills by the"
              echo "minute. The reaper removes it at its expiry, hourly — but do not wait."
            fi
            if [ "$flink" != "READY" ] && [ "$flink" != "STOPPING" ] && [ "$flink" != "DELETING" ]; then
              echo ":warning: **the Flink application is \`$flink\`**, not stopped. KPUs bill"
              echo "for as long as it runs."
            fi
            echo ""
            echo "The reaper will remove whatever remains at its expiry, hourly."
          } >> "$GITHUB_STEP_SUMMARY"

          fail=0
          [ -z "$remaining" ] || { echo "::error::an endpoint survived the cleanup: $remaining"; fail=1; }
          case "$flink" in
            READY|STOPPING|DELETING) ;;
            *) echo "::error::the Flink application is $flink after a stop was requested. It bills while it runs"; fail=1 ;;
          esac
          exit $fail

