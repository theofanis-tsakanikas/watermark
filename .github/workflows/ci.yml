# Every pull request. No credentials, no AWS account, no network beyond installing dependencies.
#
# That is not a limitation to apologise for — it is the design. Every claim this repository
# makes is checked here, on a runner with nothing, which is the same thing as saying a reviewer
# can check them on a laptop.
#
# CI exists from the first commit. A suite added to a finished project is a suite shaped to
# pass the project.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Deploy re-runs this whole file against the exact ref being deployed. Without
  # `workflow_call`, a `uses: ./.github/workflows/ci.yml` is not a reusable workflow at all and
  # the deploy fails before its first step — which is how a repository ends up with a deploy
  # path nobody has ever successfully started.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality:
    name: lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests tests_flink scripts data evals streaming
      - run: ruff format --check src tests tests_flink scripts data evals streaming
      # Tier one of ADR-0003: pure, no JVM, under a second. Everything except the core↔Flink
      # equivalence is proved here.
      - run: pytest -q

  claims:
    name: the claim gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -e ".[dev]"

      - name: the entity contracts load and cross-check
        # A personal-data entity with no declared purpose does not load (GDPR Art. 5(1)(b)),
        # and neither does a set whose references point at entities that do not exist.
        run: python scripts/check_contracts.py

      - name: the generated day reproduces its recording
        # The hinge. If the fixture drifts, every claim below was scored against a different
        # day than the one that was reviewed; if the fixture holds and the fingerprint moves,
        # the system changed.
        run: python scripts/seed_check.py

      - name: "claim 1 — no decision from a window that has not closed"
        run: python -m evals.watermark

      - name: "claim 2 — replay is identical"
        run: python -m evals.replay

      - name: "claim 3 — train/serve parity"
        run: python -m evals.parity

      - name: "claim 4 — no decision on a stale feature"
        run: python -m evals.freshness

      - name: "claim 5 — no model reaches an endpoint ungated"
        # The shipped model is *refused* by this gate, for the label-coverage finding in
        # docs/BIAS-FINDING.md. That is the result, and the harness asserts the refusal.
        run: python -m evals.promotion

      - name: "claim 6 — erasure is complete to a declared boundary"
        run: python -m evals.erasure

      - name: the Lake Formation access suite
        # Both halves: what each principal can reach and what must stay closed. A suite that
        # only asserts the first passes just as happily on a policy that grants everything —
        # which is the direction a tag policy fails in.
        run: python scripts/check_policy_access.py

      - name: a full capture stays inside the cost envelope
        # CLAUDE.md says a design that pushes past €100 is wrong before the budget is. That is
        # only load-bearing if something checks it.
        run: python scripts/check_cost_envelope.py

      - name: "claim 7 — no automatic consequential decision about a person"
        run: python -m evals.oversight

      - name: the technical documentation has not drifted from the contracts
        # AI Act Art. 11 and Annex IV, generated rather than written. A hand-edited generated
        # document describes the system somebody meant to build.
        run: python scripts/generate_annex_iv.py --check

      - name: the two feature mechanisms are independent
        # ADR-0004. Without this, the first refactor to notice that the two aggregators look
        # alike merges them — reasonably — and claim 3 compares a function with itself from
        # that day on, reporting green in eleven milliseconds forever.
        run: python scripts/check_parity_paths_are_independent.py

      - name: the stream core is framework-free and reads no ambient state
        # The precondition for every other claim. The day a boto3 import or a `datetime.now()`
        # appears three levels down inside a windowing function, nothing fails — the suite just
        # stops being runnable by a stranger, and that was the whole of the evidence.
        run: python scripts/check_core_is_pure.py

      - name: the equivalence tier and the deployment run the same Flink
        # ADR-0003. Against a different Flink than the deployed one, tier two establishes
        # equivalence with something nobody is running — which looks like coverage.
        run: python scripts/check_flink_versions_agree.py

      - name: the streaming adapter carries no semantic literal
        # ADR-0003. `.allowed_lateness(Time.minutes(5))` is one line, and after it the core and
        # the deployed job disagree about what late means with only the job being right.
        run: python scripts/check_adapter_is_thin.py

      # All seven claims are checked above. Every one of them runs on a runner with no AWS
      # account, which is the same thing as saying a reviewer can check them on a laptop.

  gate-proof:
    name: attack our own gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -e ".[dev]"
      # Copies the repository, plants a real violation, and requires the *named* gate to refuse
      # it for the right reason. A gate that has never been shown to fail is a comment.
      - run: python scripts/gate_proof.py

  equivalence:
    name: core equals Flink
    runs-on: ubuntu-latest
    # `continue-on-error` and the honest reason for it: `apache-flink` will not install on the
    # machine this repository was written on (macOS/arm64, Python 3.12 — apache-beam has no
    # wheel and fails to build), so this job has never been observed green anywhere. Marking it
    # required before anybody has seen it pass would block every pull request on a job whose
    # failures nobody can reproduce locally.
    #
    # It is **not** silently skipped: WATERMARK_REQUIRE_FLINK below makes a missing runtime a
    # hard failure inside the job, so the result is always either a real pass or a real failure
    # — visible in the checks list, and excluded from the README scoreboard until it is green.
    # The moment it is, this flag comes off and the row appears.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install -e ".[dev,flink]"
      - name: core equals Flink
        # Tier two of ADR-0003. The pure core reimplements event-time semantics, so claim 1 is
        # a statement about a model until the real job runs on a MiniCluster over the same
        # fixtures and produces the same bytes.
        env:
          WATERMARK_REQUIRE_FLINK: "1"
        run: make test-flink

  infrastructure:
    name: terraform and checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.5
      - run: pip install -e ".[dev]"
      - name: install checkov on its own
        # It pins boto3 exactly. A scanner is a tool; boto3 is the application. Keeping them in
        # separate environments is what stops the scanner deciding the application's dependency
        # floor.
        run: pipx install checkov
      - run: terraform fmt -check -recursive infra
      - name: validate every layer against real provider schemas
        # `-backend=false`: no state, no credentials, nothing reached but the provider registry.
        # This is what catches an attribute that does not exist, and it is the difference
        # between "this should apply" and "this applies".
        run: python scripts/tf_validate.py
      - name: Terraform, dbt and the queries agree on the lakehouse
        # `dbt parse` resolves sources against sources.yml, not against a catalogue: an invented
        # table name compiles cleanly and fails on the first real build, after the estate is up.
        run: python scripts/check_lakehouse_wiring.py
      - name: everything reached from inside the VPC has a way out
        # There is no NAT gateway. A service with no endpoint does not fail — it hangs, and the
        # control plane reports the application healthy throughout.
        run: python scripts/check_vpc_endpoints.py
      - name: every OIDC subject names this repository and an environment
        # CKV_AWS_358 cannot parse GitHub's immutable subject and reads only the first value of
        # the list. This reads all of them and refuses any wildcard.
        run: python scripts/check_oidc_subjects.py
      - name: every required Terraform variable is supplied by the deploy workflow
        # A missing TF_VAR does not fail at plan time in automation; it fails inside the apply
        # loop, four minutes in, with an earlier layer already created.
        run: python scripts/check_deploy_inputs.py
      - name: the application package builds
        # `make package` depends on `make connector`, which fetches the JAR from Maven Central.
        # The first CI run after the guard was added failed here, correctly: the guard exists
        # so that a package without the connector cannot be produced, and CI was producing one.
        # Not a formality. archive_file needs a directory to zip, and a packaging step that has
        # only ever run on a laptop fails inside a deploy — which is the expensive place.
        run: make package
      - name: checkov
        # Zero findings. Every deliberate exception carries an inline reason beside the resource
        # it applies to — a suppression file nobody reads is how a scanner stops meaning
        # anything.
        run: checkov -d infra --compact --quiet
