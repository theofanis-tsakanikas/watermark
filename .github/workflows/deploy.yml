# The only way anything reaches AWS. Manual dispatch, a required reviewer, and OIDC.
#
# `docs/DECISIONS.md` 15 said the estate would never be applied. That was a decision about
# *timing*, and it has been taken back deliberately: the repository is deployed from here, and
# the cost posture that used to be enforced by never running is now enforced by `expires_at`,
# the reaper and a budget action that detaches this role's permissions at its ceiling.
#
# Four properties are worth reading for.
#
# **CI runs first, against the exact ref.** Not "CI passed on main last night". The whole suite,
# every claim, every gate and every scan re-run against the commit being deployed, as a
# reusable workflow — because a deploy of a ref nobody tested is a deploy of an untested ref no
# matter how green the branch looks.
#
# **Layers apply in order, and each one stops the next.** Foundation creates the VPC and the
# keys that streaming reads through data sources; a streaming apply against a half-built
# foundation fails somewhere in the middle and leaves both.
#
# **The expensive things stay off.** The Managed Flink application is created stopped, the
# Feature Store online store and the endpoint are behind flags that default to false. Starting
# them is `capture.yml`'s job, in a bounded block, deliberately.
#
# **Every resource gets an expiry.** `expires_at` is required, has no default, and the reaper
# enforces it hourly. An estate that outlives its purpose is the only way this project spends
# money it did not mean to.

name: deploy

on:
  workflow_dispatch:
    inputs:
      layer:
        description: "Which layer to apply. `all` applies them in dependency order."
        required: true
        type: choice
        options: [all, foundation, streaming, lakehouse, ml, governance]
        default: all
      stream_position:
        description: "Where a fresh Flink application starts reading. TRIM_HORIZON replays everything still on the stream — the conservative default. LATEST starts from now, which is what a clean scenario demonstration needs when earlier captures have left records behind."
        required: true
        type: choice
        options: [TRIM_HORIZON, LATEST]
        default: TRIM_HORIZON
      expires_at:
        description: "RFC-3339 instant after which the reaper destroys this estate, e.g. 2026-08-10T18:00:00Z"
        required: true
        type: string
      confirm:
        description: "Type the word `apply` to confirm. A dispatch form with one button is a button somebody presses by accident."
        required: true
        type: string

permissions:
  contents: read
  id-token: write # the OIDC token. There is no secret anywhere in this file.

concurrency:
  # Never two applies at once. The S3 backend takes a lock, so the second would fail — noisily,
  # halfway, with one layer applied and another waiting on a lock that outlives its job.
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  confirm:
    name: confirm the intent
    runs-on: ubuntu-latest
    steps:
      - name: the confirmation word
        run: |
          if [ "${{ inputs.confirm }}" != "apply" ]; then
            echo "::error::Type 'apply' in the confirm field. This creates billable resources."
            exit 1
          fi
      - name: the expiry is in the future and not far in it
        # A far-future expiry is the same as no expiry, which is the failure mode the tag
        # exists to prevent. Seven days is longer than any capture this project would run.
        run: |
          python3 - <<'PY'
          import datetime as dt, sys
          raw = "${{ inputs.expires_at }}"
          try:
              expires = dt.datetime.fromisoformat(raw.replace("Z", "+00:00"))
          except ValueError:
              sys.exit(f"::error::{raw!r} is not an RFC-3339 instant")
          now = dt.datetime.now(dt.UTC)
          if expires <= now:
              sys.exit("::error::the expiry is in the past; the reaper would destroy this immediately")
          if expires > now + dt.timedelta(days=7):
              sys.exit("::error::an expiry more than seven days out is the same as no expiry")
          print(f"expires {expires.isoformat()}, in {(expires - now)}")
          PY

  verify:
    name: the whole suite, against this exact ref
    needs: confirm
    uses: ./.github/workflows/ci.yml

  apply:
    name: terraform apply
    needs: verify
    runs-on: ubuntu-latest
    # The environment is the authorisation. Required reviewers hang off it, and the OIDC subject
    # the deploy role trusts names it — without the environment the token's `sub` does not
    # match and the role cannot be assumed. That is the intended failure, not a misconfiguration.
    environment: deploy

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.5

      - run: pip install -e ".[dev]"

      - name: build the application packages
        # Before the credentials, deliberately. A packaging failure should stop the deploy while
        # nothing has been created, not four minutes in with the foundation already up.
        #
        # Two of them. `package` vendors the Flink job; `package-ml` builds the wheel every
        # SageMaker processing step installs before running our code, plus the population the
        # snapshot step pins. Without the second, `infra/ml` uploads an empty code channel and
        # the pipeline fails inside a cluster that is already being paid for.
        run: |
          make package
          make package-ml

      - name: show the identity this job will present
        # `Not authorized to perform sts:AssumeRoleWithWebIdentity` is the same message for a
        # wrong repository, a wrong environment, a wrong audience and a missing provider. It
        # names none of them. Printing the claims the token actually carries turns that into a
        # comparison anyone can make against the trust policy in `infra/bootstrap`.
        #
        # Only the identity fields are printed. The token itself is a credential and stays out
        # of the log.
        run: |
          set -euo pipefail
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r .value)
          payload=$(printf '%s' "$token" | cut -d. -f2)
          case $(( ${#payload} % 4 )) in
            2) payload="${payload}==" ;;
            3) payload="${payload}=" ;;
          esac
          printf '%s' "$payload" | tr '_-' '/+' | base64 -d \
            | jq '{sub, aud, repository, environment, ref, job_workflow_ref}'

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          # Composed, not transcribed. The name is the one `infra/bootstrap` chose, so it is a
          # constant here; the account id is the single value CI cannot derive, because it has
          # to know *which* account before it can ask that account anything.
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/watermark-deploy
          aws-region: ${{ vars.AWS_REGION }}
          # Short. The apply takes minutes; an hour-long session is fifty minutes of credential
          # nobody needs.
          role-duration-seconds: 3600

      - name: build and push the processing image
        # Tagged with the commit that built it, and the repository is IMMUTABLE — so a tag
        # always means the same bytes, and the pair of (image, wheel) that a pipeline execution
        # used can be reconstructed from its own record.
        #
        # Skipped when the tag already exists. The image changes only when its Dockerfile does,
        # which is rarely; rebuilding an identical image on every deploy would be a minute of
        # runner time and a registry of near-identical layers, and `IMMUTABLE` refuses the push
        # anyway.
        run: |
          set -euo pipefail
          registry="${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com"
          repository="watermark/processing"
          tag="${{ github.sha }}"
          echo "PROCESSING_IMAGE_TAG=$tag" >> "$GITHUB_ENV"

          if aws ecr describe-images --repository-name "$repository" --image-ids imageTag="$tag" >/dev/null 2>&1; then
            echo "$repository:$tag already pushed"
            exit 0
          fi

          aws ecr get-login-password --region "${{ vars.AWS_REGION }}" \
            | docker login --username AWS --password-stdin "$registry"
          docker build -t "$registry/$repository:$tag" containers/processing
          docker push "$registry/$repository:$tag"

      - name: resolve what bootstrap published
        # Everything below is a consequence of a name `infra/bootstrap` already chose, so it is
        # read from that layer rather than copied into repository configuration. A copied value
        # looks like an independent setting: rename the state bucket and this becomes a deploy
        # that fails on a backend nobody can find, with the fix in a settings page instead of a
        # diff.
        run: |
          set -euo pipefail
          read_param() {
            aws ssm get-parameter --name "/watermark/bootstrap/$1" \
              --query 'Parameter.Value' --output text
          }
          echo "TF_STATE_BUCKET=$(read_param state_bucket)" >> "$GITHUB_ENV"
          echo "resolved from /watermark/bootstrap/*"

      - name: the substations, from the generator that declares them
        # Not a repository variable. The list already exists in `data/cast.py`, and a second
        # copy in a settings page is a copy that drifts — a substation added to the generator
        # and not to the variable is a partition that cannot hold the watermark back, so every
        # window closes without it, silently. Reading the source of truth makes that impossible
        # rather than merely documented.
        run: |
          set -euo pipefail
          SUBSTATIONS=$(python3 -c '
          import json
          from data.cast import SUBSTATIONS
          print(json.dumps(list(SUBSTATIONS)))
          ')
          echo "SUBSTATIONS=$SUBSTATIONS" >> "$GITHUB_ENV"
          echo "substations from data/cast.py: $SUBSTATIONS"

      - name: stop the Flink application if it is running
        # Managed Flink takes a snapshot before an update, and refuses when the application is
        # unhealthy: "Failed to take snapshot ... The application is currently experiencing
        # downtime." A job in a crash loop is therefore a job that cannot be *fixed* by a
        # deploy — the update that carries the fix is the one it blocks.
        #
        # So it is stopped first, with `--force`, which skips the snapshot. Nothing is lost that
        # matters: this estate is stood up and torn down in bounded blocks and holds no state
        # worth restoring across a code change. `capture.yml` starts it again.
        run: |
          set -euo pipefail
          status=$(aws kinesisanalyticsv2 describe-application --application-name watermark \
            --query 'ApplicationDetail.ApplicationStatus' --output text 2>/dev/null || echo "ABSENT")
          echo "flink application: $status"
          case "$status" in
            RUNNING|STARTING|UPDATING)
              aws kinesisanalyticsv2 stop-application --application-name watermark --force
              aws kinesisanalyticsv2 wait application-ready --application-name watermark 2>/dev/null || sleep 30
              echo "stopped"
              ;;
          esac

      - name: apply the layers, in dependency order
        env:
          TF_VAR_expires_at: ${{ inputs.expires_at }}
          TF_VAR_aws_region: ${{ vars.AWS_REGION }}
          TF_VAR_github_owner: ${{ github.repository_owner }}
          TF_VAR_substations: ${{ env.SUBSTATIONS }}
          TF_VAR_initial_stream_position: ${{ inputs.stream_position }}
          TF_VAR_processing_image_tag: ${{ env.PROCESSING_IMAGE_TAG }}
        run: |
          set -euo pipefail
          ORDER="foundation streaming lakehouse ml governance"
          if [ "${{ inputs.layer }}" != "all" ]; then ORDER="${{ inputs.layer }}"; fi

          for layer in $ORDER; do
            echo "::group::$layer"
            terraform -chdir="infra/$layer" init \
              -backend-config="bucket=$TF_STATE_BUCKET" \
              -backend-config="region=${{ vars.AWS_REGION }}"
            # The plan is written out and printed before it is applied. A reviewer approving an
            # environment approves an intent; the plan is what the intent turned out to mean.
            terraform -chdir="infra/$layer" plan -out=tfplan
            terraform -chdir="infra/$layer" show -no-color tfplan
            terraform -chdir="infra/$layer" apply -auto-approve tfplan
            echo "::endgroup::"

            # **Realise the Iceberg tables, between the layer that defines the job and the layer
            # that attaches a ruleset to its output.** ADR-0008: an Iceberg table is its
            # metadata and metadata is written by an engine, so Terraform cannot create one —
            # `land_to_silver` does, with `CREATE TABLE IF NOT EXISTS`, and runs here with
            # nothing landed for that sole purpose. It is idempotent and it costs one Glue DPU
            # minute; a governance apply against a table that does not exist costs a failed
            # deploy.
            if [ "$layer" = "lakehouse" ]; then
              echo "::group::create the Iceberg tables"
              run_id=$(aws glue start-job-run --job-name watermark-land-to-silver \
                --query JobRunId --output text)
              echo "land-to-silver $run_id"
              for _ in $(seq 1 40); do
                state=$(aws glue get-job-run --job-name watermark-land-to-silver \
                  --run-id "$run_id" --query 'JobRun.JobRunState' --output text)
                echo "  $state"
                case "$state" in
                  SUCCEEDED) break ;;
                  FAILED|ERROR|TIMEOUT|STOPPED)
                    aws glue get-job-run --job-name watermark-land-to-silver --run-id "$run_id" \
                      --query 'JobRun.ErrorMessage' --output text
                    echo "::error::the table-creating run of land-to-silver $state"
                    exit 1 ;;
                esac
                sleep 15
              done
              echo "::endgroup::"
            fi
          done

      - name: what exists now, and when it expires
        env:
          TF_VAR_expires_at: ${{ inputs.expires_at }}
        run: |
          echo "### Applied" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Expires at \`${{ inputs.expires_at }}\`; the reaper runs hourly." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The Flink application was created **stopped**, and the Feature Store online" >> "$GITHUB_STEP_SUMMARY"
          echo "store and the inference endpoint are **off**. Those three are what cost money" >> "$GITHUB_STEP_SUMMARY"
          echo "while idle; starting them is a separate, deliberate act." >> "$GITHUB_STEP_SUMMARY"
