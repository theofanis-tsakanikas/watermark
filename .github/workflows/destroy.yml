# Take it all down. More important than the deploy, and dispatched as often.
#
# A deploy that cannot be reversed is a deploy nobody should make. This workflow is the reason
# the €100 target in `CLAUDE.md` is a constraint rather than a hope: the estate exists in
# bounded blocks because taking it down is one dispatch rather than an afternoon in the console
# finding things.
#
# **Reverse dependency order.** Governance and ml first, foundation last — destroying the VPC
# while the Flink application is still attached leaves elastic network interfaces the VPC
# delete cannot remove, and the layer hangs for twenty minutes before failing.
#
# **The state bucket survives.** `infra/bootstrap` is not in the list and `prevent_destroy` is
# on the bucket. Destroying the backend leaves an estate nothing can reach — the one failure
# worse than paying for an idle one.
#
# **It does not need CI to pass.** Deliberately. The moment somebody most needs to destroy an
# estate is the moment something is broken, and a teardown gated on a green suite is a teardown
# that is unavailable exactly when the bill is running.

name: destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type `destroy` to confirm."
        required: true
        type: string
      layer:
        description: "Which layer, or `all` for everything except bootstrap."
        required: true
        type: choice
        options: [all, governance, ml, lakehouse, streaming, foundation]
        default: all

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  destroy:
    name: terraform destroy
    runs-on: ubuntu-latest
    environment: destroy

    steps:
      - name: the confirmation word
        run: |
          if [ "${{ inputs.confirm }}" != "destroy" ]; then
            echo "::error::Type 'destroy' in the confirm field."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # `data.cast` imports the core to describe the generated day, so the package has to be
      # installed before the substations can be read. It was not, and the teardown died on
      # `No module named 'watermark'` — the same omission capture.yml had, in the one workflow
      # that matters most when something is already wrong.
      - run: pip install -e "."

      # The same archives the deploy builds. `data "archive_file"` is read during a *destroy*
      # too — Terraform evaluates the configuration before it can tear it down — so a teardown
      # without them fails on "error creating archive: could not archive missing directory".
      #
      # A teardown that depends on a build is not ideal and it is the honest shape here: the
      # archives are inputs to resources this layer owns, and pretending otherwise would mean a
      # destroy that works only on a machine that happens to have built recently.
      - run: |
          make package
          make package-ml

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.5

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          # Composed from the account id and the name bootstrap chose. See deploy.yml.
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/watermark-deploy
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 3600

      - name: resolve what bootstrap published
        run: |
          set -euo pipefail
          aws ssm get-parameter --name "/watermark/bootstrap/state_bucket" \
            --query 'Parameter.Value' --output text \
            | sed 's/^/TF_STATE_BUCKET=/' >> "$GITHUB_ENV"

      - name: the substations, from the generator that declares them
        # A destroy does not care what the value is, only that the configuration evaluates. It
        # is read from the same source as the deploy anyway: a second copy here would be the
        # copy that drifts, and a teardown that fails on a stale variable is a teardown that
        # leaves the estate standing and billing.
        run: |
          set -euo pipefail
          python3 -c '
          import json
          from data.cast import SUBSTATIONS, meter_assignments
          print("SUBSTATIONS=" + json.dumps(list(SUBSTATIONS)))
          # The data subjects, for the same reason and from the same source. A destroy resolves
          # every variable the layer declares, whether or not the value affects what is torn
          # down — `infra/governance/` gained `subjects` when the per-subject crypto-shredding
          # keys landed, `deploy.yml` was wired for it and this file was not, and the first
          # teardown afterwards failed with `No value for required variable`.
          #
          # A teardown that fails on a missing variable is a teardown that leaves the estate
          # standing and billing, which is the one failure mode this workflow exists to prevent.
          # It is deliberately the *whole* cast rather than the subjects that still have keys:
          # Terraform needs a value to plan a destroy against, not an inventory.
          print("SUBJECTS=" + json.dumps(sorted(
              {v.attributes["customer_id"] for v in meter_assignments().versions})))
          ' >> "$GITHUB_ENV"

      - name: empty the model registry
        # A model package group cannot be deleted while it holds versions — the same rule as an
        # S3 bucket with objects, and Terraform has no `force_delete` for it. Every capture
        # registers a candidate, so a second teardown always meets this.
        #
        # Deleting the *versions* is the point rather than a workaround: they are the artefacts
        # a promotion gate argued about, and a teardown that left them behind would leave the
        # registry claiming a lineage whose training data and pipeline no longer exist.
        #
        # `|| true` on the group listing only: an account with no groups is a clean teardown,
        # not an error.
        run: |
          set -euo pipefail
          for group in watermark-meter-anomaly watermark-curtailment-forecast; do
            versions=$(aws sagemaker list-model-packages --model-package-group-name "$group" \
              --query 'ModelPackageSummaryList[].ModelPackageArn' --output text 2>/dev/null || true)
            for arn in $versions; do
              echo "deleting $arn"
              aws sagemaker delete-model-package --model-package-name "$arn"
            done
          done

      - name: delete the experiment trial components the pipeline left behind
        # SageMaker creates one of these for every processing and training job in a pipeline
        # execution, implicitly. Terraform never sees them, so a `destroy` cannot remove them
        # and they accumulate across captures — sixty-two after a day of iteration.
        #
        # They cost nothing, and that is exactly why they are worth deleting here rather than
        # ignoring: the check that says "nothing of ours is left" is only useful if it can
        # return zero. A permanent residue trains the reader to skip the one line that would
        # have named a real leak.
        #
        # Named rather than tagged: the tag API lags deletions by up to two days, which makes it
        # the wrong instrument for a teardown that wants to verify itself immediately.
        run: |
          set -euo pipefail
          python3 - <<'CLEANUP'
          import json, subprocess

          listed = subprocess.run(
              ["aws", "sagemaker", "list-trial-components", "--max-results", "100"],
              capture_output=True, text=True, check=True,
          )
          names = [
              c["TrialComponentName"]
              for c in json.loads(listed.stdout).get("TrialComponentSummaries", [])
              if c["TrialComponentName"].startswith("pipelines-")
          ]
          deleted = 0
          for name in names:
              result = subprocess.run(
                  ["aws", "sagemaker", "delete-trial-component", "--trial-component-name", name],
                  capture_output=True, text=True,
              )
              deleted += result.returncode == 0
          print(f"trial components: deleted {deleted} of {len(names)}")
          CLEANUP

      - name: destroy the layers, in reverse dependency order
        env:
          # Required by the variable, unused by a destroy. Supplied so that `terraform destroy`
          # can evaluate the configuration at all — a missing required variable makes a
          # teardown prompt for input in a workflow that has no terminal.
          TF_VAR_expires_at: "2000-01-01T00:00:00Z"
          TF_VAR_aws_region: ${{ vars.AWS_REGION }}
          TF_VAR_github_owner: ${{ github.repository_owner }}
          # Same reason as `expires_at` above: `substations` has no default, and a destroy that
          # cannot evaluate the streaming configuration cannot tear it down either.
          TF_VAR_substations: ${{ env.SUBSTATIONS }}
          TF_VAR_subjects: ${{ env.SUBJECTS }}
          # Required by the variable, irrelevant to a destroy: the configuration has to evaluate
          # before Terraform can tear it down. Same reason as `expires_at` above.
          TF_VAR_processing_image_tag: "unused-by-a-destroy"
        run: |
          set -euo pipefail
          ORDER="governance ml lakehouse streaming foundation"
          if [ "${{ inputs.layer }}" != "all" ]; then ORDER="${{ inputs.layer }}"; fi

          for layer in $ORDER; do
            echo "::group::$layer"
            terraform -chdir="infra/$layer" init \
              -backend-config="bucket=$TF_STATE_BUCKET" \
              -backend-config="region=${{ vars.AWS_REGION }}"
            terraform -chdir="infra/$layer" destroy -auto-approve
            echo "::endgroup::"
          done

      - name: what is left
        run: |
          echo "### Destroyed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`infra/bootstrap\` is deliberately untouched: the state bucket and the role" >> "$GITHUB_STEP_SUMMARY"
          echo "this workflow assumed to do the destroying live there. An estate nothing can" >> "$GITHUB_STEP_SUMMARY"
          echo "reach is the one failure worse than an idle one." >> "$GITHUB_STEP_SUMMARY"
