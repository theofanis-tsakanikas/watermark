# dbt-athena over the Iceberg lakehouse.
#
# dbt owns the *gold* layer and nothing above it. Silver — the closed windows and their
# restatements — is written by the Flink job, because that is where claim 1 is decided and a
# second implementation of window closure in SQL would be exactly the "two implementations of
# one thing" that `docs/SCENARIO.md` lists as a pathology. What dbt does is aggregate what the
# stream already published, which is arithmetic, and arithmetic is the part SQL should own.
#
# The silver models below are `source` declarations and tests, not transformations. They exist
# so that a change to the stream's output shape breaks `dbt build` at parse time rather than
# three models downstream.

name: watermark
version: 1.0.0
config-version: 2
profile: watermark

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  watermark:
    +materialized: table
    gold:
      # **No `+schema:` here, and the first live run of dbt explained why.**
      #
      # `profiles.yml` already targets `{{ env_var('WATERMARK_PROJECT') }}_gold`, which *is* the
      # gold schema. dbt's default `generate_schema_name` appends a model's custom schema to the
      # target's, so `+schema: gold` on top of it produced `watermark_gold_gold` — a database
      # nothing creates, named in every error the run emitted.
      #
      # Iceberg, so every gold table has the same erasure surface as the rest of the lakehouse.
      # A Hive-format gold table would be a set of files claim 6 could only reach by rewriting
      # a prefix, and it would be the one table nobody remembers.
      +table_type: iceberg
      +format: parquet
      # **No table properties, after two attempts that each failed differently.**
      #
      # `write.delete.mode` and `write.update.mode` asked for merge-on-read. Properties are
      # interpolated into `WITH (...)` unquoted, so a key containing a dot is parsed as a
      # qualified name: `mismatched input '.'. Expecting: '='`.
      #
      # `format_version: '2'` replaced them, on dbt's own Athena documentation recommending it be
      # set explicitly. Athena answered `Table properties [format_version] are not supported` —
      # the recommendation is for the Spark-on-Athena path, and these models are built by the
      # Trino engine, which does not take it.
      #
      # So: none. Athena writes format-version-2 Iceberg by default, which is what the property
      # was asking for, and a property the engine rejects is worse than one it defaults to
      # correctly. Neither attempt ever reached a table — both failed at DDL — so nothing they
      # were arguing about was ever in force.

vars:
  # Bound at run time by the orchestration, never interpolated into SQL by hand. A settlement
  # query built by string concatenation is one somebody eventually builds from a
  # customer-supplied meter id.
  settlement_from: "1970-01-01"
  settlement_to: "2100-01-01"
