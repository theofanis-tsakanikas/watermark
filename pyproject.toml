[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "watermark"
version = "0.1.0"
description = "Real-time decision platform for an electricity distribution network — no decision on a window that has not closed"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Theofanis Tsakanikas" }]
keywords = [
    "responsible-ai",
    "stream-processing",
    "flink",
    "watermarks",
    "feature-store",
    "eu-ai-act",
    "gdpr",
]

# Short, and it stays short. **`src/watermark/core/` imports none of these** — the stream core
# is the standard library and nothing else, which is what makes claims 1 to 4 checkable on a
# laptop with no cluster and no account, and `scripts/check_core_is_pure.py` enforces it.
#
# These serve the contract layer, which sits outside the core: contracts are YAML data, and a
# contract that loads with a wrong shape is worse than one that fails to load.
# `tests/test_dependencies.py` fails on a dependency nothing imports, in either direction.
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Cloud clients are NOT a hard dependency. The whole suite, every eval and every gate run
# without them; this extra exists only to talk to a live estate.
cloud = [
    "boto3>=1.40",
]
# Tier two of ADR-0003: the core↔Flink equivalence test on a local MiniCluster. Never a hard
# dependency — `make test`, every claim gate and `make preflight --fast` must keep running on
# a machine with no JVM. The version floor tracks the deployed Managed Flink runtime, and
# `scripts/check_flink_versions_agree.py` will compare the two once `infra/streaming/` exists;
# an equivalence test against a different Flink than the one running proves equivalence with
# something nobody uses.
flink = [
    # The minor version must match `flink_runtime` in `infra/streaming/variables.tf`;
    # `scripts/check_flink_versions_agree.py` compares them. 1.20 rather than 2.x because that
    # is what this application's connectors are pinned against, and because a runtime the
    # equivalence tier cannot install is a tier that never runs.
    "apache-flink>=1.20",
]
# Tier two of ADR-0005: the gradient-boosted forecaster, in the *practical* reproducibility
# tier. Never a hard dependency — `make test`, every claim gate and every eval must keep running
# on a laptop with nothing but the standard library, pydantic and pyyaml. CI installs it and
# `tests/test_gradient_tier.py` fails rather than skips there, because a tier that silently does
# not run is a promise nobody is checking.
ml = [
    "xgboost>=2.1",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    # checkov is deliberately absent from this environment: it pins boto3 exactly, and a
    # scanner is a tool while boto3 is the application. `make iac-scan` builds it its own
    # venv on demand; CI installs it separately. The scan itself gates every push either way.
]

[tool.hatch.build.targets.wheel]
packages = ["src/watermark"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "PL", "S"]
ignore = [
    "PLR0913", # a resolver legitimately takes many explicit inputs
    "S101",    # assert is how tests assert
]

[tool.ruff.lint.per-file-ignores]
# Managed Flink runs this file as a script, so `sys.path` must be repaired before the package
# can be imported at all — see the comment at the top of the file. Every import below that is
# E402 by construction, and the alternative is five `noqa`s that read like carelessness.
"streaming/job.py" = ["E402"]
# S311: `random.shuffle` is how the replay tests shuffle. Claim 2 asserts that the same events
# in a different order produce the same bytes, so a *seeded, reproducible, non-cryptographic*
# generator is exactly the right tool — and the seed is what makes a failure reproducible.
"tests/**" = ["PLR2004", "S105", "S106", "S311"]
# S311: the replay harness shuffles with a *seeded* generator, which is the point — claim 2 is
# that a different order produces the same bytes, and the seed is what makes a failure
# reproducible by the person reading it.
"evals/**" = ["PLR2004", "S311"]
# S608 flags the f-string that compiles a feature contract into SQL. It is right to look and
# wrong about this one: every interpolated value comes from a contract already validated by
# `contracts/features.py` — the aggregation is a key into a closed mapping, the identifiers
# match `^[a-z][a-z0-9_]*$`, the window is an integer. What is never interpolated is the *data*:
# the entity id and both time bounds are `?` placeholders the caller binds. The suppression is
# per-file rather than per-line because ruff attributes the diagnostic to a multi-line string
# it cannot be annotated inside, and a `noqa` that silently does nothing is worse than none.
"src/watermark/features/offline.py" = ["S608"]
# S608 in the Glue maintenance jobs. The interpolated values are the table names in a module
# constant and integers from Glue's own argument parser — there is no caller and no user input
# anywhere near them. Spark's `CALL system.rewrite_data_files(...)` takes its table as a string
# literal, so there is no bound-parameter form to use instead.
"pipelines/jobs/*.py" = ["S608"]
# PLR0917: the parity comparison takes the contract, both mechanisms, the population, the
# instants and the serving lag. Bundling them into a context object would hide which of the two
# mechanisms a given line touches, and that visibility is the one thing a reader of this
# function needs — it is the function whose whole purpose is that the two are separate.
"src/watermark/features/parity.py" = ["PLR0917"]
# These scripts shell out to `terraform`, `make` and `git` by name. A hardcoded absolute path
# would be wrong on every machine but the one that wrote it, and the commands are fixed
# literals with no user input anywhere near them.
"scripts/preflight.py" = ["S607"]
"scripts/tf_validate.py" = ["S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "gate: exercises a CI-enforced acceptance gate",
    "eval: scores a labelled scenario (credential-free)",
    "slow: takes more than a second",
]

[tool.coverage.run]
source = ["src/watermark"]
branch = true
